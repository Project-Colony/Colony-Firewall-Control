syntax = "proto3";

package cfc.v1;

// Colony Firewall Control IPC schema.
// Spoken between the root daemon (server) and UI/CLI clients over a Unix
// domain socket.

service Firewall {
  // The UI subscribes once and receives a streaming feed of new connections
  // that need a verdict from the user.
  rpc StreamPrompts(SubscribeRequest) returns (stream PromptEvent);

  // The UI returns a verdict for a specific prompt id.
  rpc SubmitVerdict(VerdictRequest) returns (VerdictResponse);

  // Rules CRUD.
  rpc ListRules(ListRulesRequest) returns (ListRulesResponse);
  rpc UpsertRule(UpsertRuleRequest) returns (UpsertRuleResponse);
  rpc DeleteRule(DeleteRuleRequest) returns (DeleteRuleResponse);

  // Live observed connections (for the live view, no verdict requested).
  rpc StreamConnections(SubscribeRequest) returns (stream ConnectionEvent);

  // Daemon status / stats.
  rpc GetStatus(StatusRequest) returns (StatusResponse);

  // Temporarily stop *prompting*. Rules are still evaluated and still
  // apply - a deny rule keeps denying while paused; what changes is that a
  // flow no rule matched is allowed straight through instead of raising a
  // prompt. A pause always ends by itself: duration_secs (or the daemon's
  // [pause] default_secs when 0) is clamped to at most 24h, and the
  // response reports the resume deadline.
  rpc SetPaused(SetPausedRequest) returns (SetPausedResponse);

  // Persisted verdict/audit log, newest first. Read-only.
  rpc ListEvents(ListEventsRequest) returns (ListEventsResponse);
}

message SubscribeRequest {
  string client_id = 1;
}

message PromptEvent {
  string prompt_id = 1;
  ConnectionInfo connection = 2;
  ProcessInfo process = 3;
  int64 deadline_unix_ms = 4;
}

message VerdictRequest {
  string prompt_id = 1;
  Action action = 2;
  Duration duration = 3;
  RuleScope persist_scope = 4;
}

message VerdictResponse {
  bool accepted = 1;
  string error = 2;
  // Set when persist_scope was given AND the rule was actually stored.
  //
  // `accepted` is about the *prompt* - it says the verdict reached a waiting
  // connection. It says nothing about the standing rule, and a storage failure
  // used to leave the client announcing "Rule created" for a rule that did not
  // exist. Empty means either no rule was asked for, or one was asked for and
  // could not be written; `persist_error` distinguishes them.
  string persisted_rule_id = 3;
  // Why the rule could not be stored. Empty when nothing went wrong.
  string persist_error = 4;
}

message ConnectionEvent {
  ConnectionInfo connection = 1;
  ProcessInfo process = 2;
  Action verdict = 3;
  string rule_id = 4;
}

message ConnectionInfo {
  string id = 1;
  int64 timestamp_unix_ms = 2;
  Protocol protocol = 3;
  Direction direction = 4;
  string src_ip = 5;
  uint32 src_port = 6;
  string dst_ip = 7;
  uint32 dst_port = 8;
  string dst_host = 9;
}

message ProcessInfo {
  uint32 pid = 1;
  uint32 ppid = 2;
  // Explicit presence: an unattributed process must read as "unknown", not
  // as uid 0 / gid 0. The daemon-side core type is Option<u32>.
  optional uint32 uid = 3;
  optional uint32 gid = 4;
  string exe = 5;
  repeated string cmdline = 6;
  string cwd = 7;
  string sha256 = 8;
  // Package that owns `exe`, as "<name> <version>" (e.g. "curl 8.21.0-1").
  // Empty when no package owns the path, when the host has no package
  // database, or when provenance checking is disabled.
  string package = 9;
  // Whether the RUNNING binary (hashed through /proc/<pid>/exe) still
  // matches the digest the package recorded for that path.
  //
  // Note the pairing with `package`: a non-empty `package` alongside
  // PROVENANCE_UNSPECIFIED means "we know which package owns this file but
  // the database records no digest we could verify against" (dpkg records
  // MD5 only, which we deliberately do not compute).
  Provenance provenance = 10;
}

message RuleScope {
  string exe_path = 1;
  string exe_sha256 = 2;
  string parent_exe = 3;
  uint32 uid = 4;
  bool has_uid = 5;
  string dst_host = 6;
  string dst_net = 7;
  uint32 dst_port = 8;
  bool has_dst_port = 9;
  Protocol protocol = 10;
  bool has_protocol = 11;
  // Which way the flow goes. Unset matches both, which is what every rule
  // written before inbound filtering existed means.
  Direction direction = 12;
  bool has_direction = 13;
  // The packet's SOURCE, i.e. the remote peer on an inbound flow. dst_net
  // cannot express "who may reach us" - inbound the destination is this
  // machine - so these are the inbound equivalents.
  string src_net = 14;
  uint32 src_port = 15;
  bool has_src_port = 16;
}

message RuleInfo {
  string id = 1;
  string name = 2;
  bool enabled = 3;
  Action action = 4;
  Duration duration = 5;
  RuleScope scope = 6;
  int64 created_at_unix_ms = 7;
  uint64 hit_count = 8;
}

message ListRulesRequest {}
message ListRulesResponse {
  repeated RuleInfo rules = 1;
}

message UpsertRuleRequest {
  RuleInfo rule = 1;
}
message UpsertRuleResponse {
  string id = 1;
  string error = 2;
}

message DeleteRuleRequest {
  string id = 1;
}
message DeleteRuleResponse {
  bool deleted = 1;
}

message StatusRequest {}
message StatusResponse {
  string version = 1;
  uint64 uptime_seconds = 2;
  uint64 rules_count = 3;
  uint64 prompts_pending = 4;
  // Counters are cumulative since the daemon started, not daily: they
  // reset on restart and never roll over at midnight. (Field 5 was named
  // `connections_today` until 0.2.0, which was simply untrue.) For
  // history that survives a restart, query ListEvents.
  uint64 connections_seen = 5;
  uint64 connections_allowed = 6;
  uint64 connections_denied = 7;
  bool paused = 8;

  // When `paused` is true, the wall-clock instant at which the daemon
  // auto-resumes enforcing. 0 when not paused.
  int64 resume_at_unix_ms = 9;

  // Live default policy (reflects the last SIGHUP reload, not the value
  // read at startup).
  Action timeout_action = 10;
  Action no_ui_action = 11;
  uint32 prompt_timeout_secs = 12;

  // Rule rows the last storage load could not deserialize. Non-zero means
  // rules exist on disk that are NOT being enforced.
  uint64 skipped_rules = 13;

  // Best-effort "packets are actually reaching us" signal. False means the
  // daemon is running but probably not in the packet path (nft/iptables
  // rule not loaded), or it was started with --dry-run.
  bool enforcing = 14;
}

message SetPausedRequest {
  bool paused = 1;
  // How long the pause lasts before the daemon auto-resumes. 0 means "use
  // the daemon's configured default" ([pause] default_secs). The daemon
  // clamps this to its own maximum and reports the effective deadline in
  // SetPausedResponse.resume_at_unix_ms.
  uint32 duration_secs = 2;
}
message SetPausedResponse {
  bool paused = 1;
  // Effective auto-resume instant. 0 when unpausing.
  int64 resume_at_unix_ms = 2;
}

// One persisted verdict record (mirrors the daemon's `events` table).
message Event {
  int64 ts_unix_ms = 1;
  string proto = 2;
  string src_ip = 3;
  uint32 src_port = 4;
  string dst_ip = 5;
  uint32 dst_port = 6;
  string dst_host = 7;
  string exe = 8;
  uint32 pid = 9;
  // Absent when the flow could not be attributed to a process.
  optional uint32 uid = 10;
  Action action = 11;
  // Verdict provenance: "rule" | "user" | "default" | "timeout".
  string source = 12;
  string rule_id = 13;
}

message ListEventsRequest {
  // 0 means the daemon's default page size; the daemon caps the maximum.
  uint32 limit = 1;
  uint32 offset = 2;
  // Empty means no filter.
  string exe_contains = 3;
  // ACTION_UNSPECIFIED means no filter.
  Action action_filter = 4;
  // 0 means no lower bound.
  int64 since_unix_ms = 5;
}
message ListEventsResponse {
  repeated Event events = 1;
  uint64 total_returned = 2;
}

enum Action {
  ACTION_UNSPECIFIED = 0;
  ACTION_ALLOW = 1;
  ACTION_DENY = 2;
  ACTION_REJECT = 3;
}

enum Duration {
  DURATION_UNSPECIFIED = 0;
  DURATION_ONCE = 1;
  DURATION_UNTIL_RESTART = 2;
  DURATION_ALWAYS = 3;
}

enum Protocol {
  PROTOCOL_UNSPECIFIED = 0;
  PROTOCOL_TCP = 1;
  PROTOCOL_UDP = 2;
  PROTOCOL_ICMP = 3;
  PROTOCOL_OTHER = 4;
}

enum Direction {
  DIRECTION_UNSPECIFIED = 0;
  DIRECTION_OUTBOUND = 1;
  DIRECTION_INBOUND = 2;
}

// Binary package provenance. See ProcessInfo.provenance.
enum Provenance {
  // Not checked, no package database, lookup failed, or the owning package
  // is known but records no verifiable digest.
  PROVENANCE_UNSPECIFIED = 0;
  // No installed package owns this path (a /tmp dropper, a hand-built
  // binary, something from a tarball).
  PROVENANCE_UNPACKAGED = 1;
  // Owned by a package and the running binary's sha256 matches.
  PROVENANCE_VERIFIED = 2;
  // Owned by a package but the running binary's sha256 DIFFERS.
  PROVENANCE_MODIFIED = 3;
}
