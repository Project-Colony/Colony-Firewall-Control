[package]
name = "cfc-daemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Colony Firewall Control - privileged decision daemon"

# The daemon's internals live in a library target so `tests/` can assemble
# them (real store + engine + router + ipc::spawn) without root or NFQUEUE.
# `src/main.rs` is the only production entry point and merely wires them up.
[lib]
name = "cfc_daemon"
path = "src/lib.rs"

[[bin]]
name = "colony-firewalld"
path = "src/main.rs"

[features]
default = ["ebpf"]
# Load and attach the kernel-side eBPF programs (crates/cfc-ebpf).
#
# ON by default. Compiling the loader in is not the same as running it: while
# `[ebpf] enabled` is off, `start` returns before any `bpf(2)` call, before any
# `/sys/kernel/btf/vmlinux` read and before any cgroup attach -- so a default
# build is exactly as inert at runtime as one built without the feature. What
# the flip buys is that the shipped binary is *able* to bring the ring-0 layer
# up on a host that can support it, instead of demanding a rebuild first.
#
# The feature pulls in `aya` and nothing else. aya is pure Rust: compiling it
# needs no bpf-linker, no BPF-capable kernel, no root and no nightly. Only
# *loading* has requirements (CAP_BPF + CAP_PERFMON, an installed object), and
# every one of them degrades to a note rather than a failure.
#
# To build without it: `cargo build -p cfc-daemon --no-default-features`.
# Package-scoped on purpose -- an unscoped `--workspace --no-default-features`
# also strips `default = ["std"]` from cfc-ebpf-common, which builds today only
# by feature unification.
#
# Note that the object itself is NOT built by this feature and is NOT embedded
# in the binary: it is loaded at runtime from `[ebpf] object_path`. See the
# module docs in src/ebpf.rs for why.
ebpf = ["dep:aya"]

[dependencies]
cfc-core = { path = "../cfc-core" }
cfc-proto = { path = "../cfc-proto" }
# POD event types shared with the kernel-side crate. Unconditional: the
# kernel process table is compiled (and unit-tested) in every configuration,
# it is simply never fed without the `ebpf` feature. The crate is
# dependency-free, so this costs nothing.
cfc-ebpf-common = { workspace = true }
aya = { workspace = true, optional = true }

tokio = { workspace = true }
tokio-stream = { workspace = true }
futures = { workspace = true }
tonic = { workspace = true }
prost = { workspace = true }

rusqlite = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

nfq = { workspace = true }
procfs = { workspace = true }
nix = { workspace = true }
libc = { workspace = true }
sha2 = { workspace = true }
dns-lookup = { workspace = true }
# Package provenance: pacman stores its per-file sha256 digests in a gzipped
# mtree. Already in Cargo.lock transitively; declared crate-local (not
# workspace-style) on purpose -- only the daemon reads a package database.
flate2 = "1.1"

once_cell = { workspace = true }
parking_lot = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
ipnet = { workspace = true }
clap = { workspace = true }

[dev-dependencies]
proptest = "1"
# test-util enables tokio::test(start_paused) for the prompt-timeout tests.
tokio = { workspace = true, features = ["test-util"] }
# tests/ipc_integration.rs drives the daemon through the same client the UI
# and CLI use, over a socket in a temp dir.
cfc-client = { path = "../cfc-client" }
tempfile = "3"
