[package]
name = "cfc-ebpf-proto"
version.workspace = true
edition.workspace = true
# Not the workspace value: the kernel-side crate builds this one with its dated
# nightly (crates/cfc-ebpf/rust-toolchain.toml, rustc 1.98.0-nightly), and cargo
# refuses a dependency whose rust-version is newer than the compiler. 1.90 is
# the minimum the workspace MSRV job verified for this crate.
rust-version = "1.90"
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Colony Firewall Control - POD types and pure parsers shared by the eBPF programs and userspace"

[features]
# `std` is on by default so the userspace side (daemon, tests) gets the
# convenience helpers. The kernel-side crate depends on this one with
# `default-features = false`, which turns the crate into `#![no_std]`.
default = ["std"]
std = []

[dependencies]
# Intentionally none. This crate is compiled for `bpfel-unknown-none` as well
# as the host, so it must stay dependency-free (and `no_std`-clean).
