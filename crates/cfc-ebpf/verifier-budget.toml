# Verifier instruction ceilings for the kernel-side programs.
#
# The kernel gives a BPF program 1,000,000 instructions and refuses it at
# 1,000,001. `cfc_dns_ingress` has been on the wrong side of that line before:
# in-kernel DNS name parsing came out at 1,000,001 and the parsing had to move
# to userspace (see README.md). Nothing warned first - it simply stopped
# loading, and it would have stopped loading on a user's machine rather than
# here if the numbers had been a little different.
#
# So these are tripwires, not targets. Each `max` is roughly 2x the observed
# cost: enough headroom that ordinary edits do not trip it, tight enough that
# a change with a runaway cost is caught in the commit that introduced it.
#
# Read by `loads_and_attaches_on_this_kernel` via `include_str!`, NOT by
# reading this path at run time: the qemu matrix runs the test binary inside a
# guest that has no source tree and no CARGO_MANIFEST_DIR.
#
# `observed` is what the verifier actually reported on the kernel named below.
# It is documentation, not a check - kernels legitimately differ. `max` is the
# check.

measured_on = "7.1.8"

[cfc_sched_process_exec]
# Raised from 600 on purpose, and the number is worth reading rather than
# rubber-stamping.
#
# The program now hashes the executable path so it can consult the kernel's own
# rule table and precommit a verdict without the daemon. That is a bounded loop
# over the path - one load, one xor, one multiply per byte - and the verifier
# walks every iteration it cannot fold, so the cost is roughly linear in
# FILENAME_LEN (256).
#
# What this budget guards is not the kernel's limit, which is 1,000,000 and
# nowhere near: it is *noticing*. A jump like this one should be a decision,
# and the runtime cost is the part that actually matters - this program runs on
# every execve on the machine. The `EXE_RULES_ON` gate exists for exactly that:
# the loop is skipped entirely on a host with no exe-scoped deny rule, which is
# the common case.
# 2355 before the fast path; the unconditional FAST_ALLOW delete on the exec
# path is the difference.
observed = 2388
max = 3000

[cfc_sched_process_exit]
# 25 before the fast path; one more map delete (FAST_ALLOW) per exit.
observed = 52
max = 200

[cfc_dns_ingress]
# The expensive one, and the reason this file exists. 17,058 is 1.7% of the
# budget; the ceiling is deliberately well under the point where a rewrite
# would be needed, so "this got much more expensive" is a test failure rather
# than a discovery someone makes six months later.
observed = 17058
max = 40000

[cfc_connect4]
# One cookie read + LRU insert, one hash lookup, one counter increment, and -
# only on the deny branch - a ring-buffer record. Then the fast path: a mark
# map read, a getsockopt, a set lookup, a deadline read and compare, and on a
# change a setsockopt - with a ring record only when a grant is honoured.
# Still small because the decision was already made at exec time and left in
# a map; anything that grows this number means work moved onto the connect()
# path, which is the one place in CFC where cost is paid by every process on
# the machine.
#
# The cookie recording is what buys back the packet path's ~37 ms /proc walk per
# new connection: 24 instructions (106 against the 82 the no-cookie twin costs)
# for a measured 44.9 -> 4.3 ms median connect. The fast path - a mark map
# read, a getsockopt, a set lookup, a deadline compare, a conditional
# setsockopt and, on a honoured grant, a ring record - took it from 106 to
# 318 on the first matrix run. Three times the instructions
# for the whole round trip: still the cheapest millisecond on offer.
#
# 318 was the number before the protocol guard - the test that keeps this hook
# from marking a socket that will never pass a hook again - and how that guard
# was *written* turned out to matter more than what it tests. Measured on 6.12,
# where the pre-guard number is 356:
#
#   flag at the top of mark_decision, live across the whole body   474  (over)
#   same flag computed one line before its only use                494  (over)
#   folded into `granted`, no extra boolean, one fewer tail branch 412  (under)
#
# The cost was never the context load. It was a second boolean alive across the
# setsockopt, its error path and the three counter arms, which makes the
# verifier walk that tail in four states instead of two; moving the computation
# later did not help, because the live range that mattered was the one *after*
# it. Folding the test into `granted` removes the boolean and one arm.
#
# One inference to distrust next time: the folded build's on-disk section came
# back to within 8 bytes of the pre-guard one, and the verifier still charges
# +66. Section size is not a proxy for verifier cost, and only the matrix knows.
#
# `max` goes 450 -> 600 with that measurement in hand. Not to turn red green -
# the ceiling did its job twice here - but because 384 against 450 leaves 17%,
# and this file's own rule is roughly 2x, "enough headroom that ordinary edits
# do not trip it". A deliberate, measured, then optimised addition is exactly
# when the ceiling moves.
observed = 384
max = 600

[cfc_connect6]
# A few more than v4: the address copy is four words instead of one.
observed = 389
max = 600

# The mark decision alone: no deny lookup, no cookie, no ring record unless a
# grant is honoured. Note what the matrix taught on the first run: 5.10
# refuses these outright - `unknown func bpf_getsockopt` on a sendmsg hook,
# while the same helper verifies on the connect hooks of that kernel - and
# 6.12 onward accepts them. That is why the fast path is off with its reason
# on the matrix floor rather than half-present.
#
# These two carry the protocol guard as well, and now pay for a decision they
# can no longer reach: with only TCP ever marked, nothing here ever sets a mark
# and there is none of ours left to strip. See TODO.md - removing them would
# take this cost and the 5.10 restriction with it.
[cfc_sendmsg4]
observed = 297
max = 400

[cfc_sendmsg6]
observed = 299
max = 400

# The no-cookie twins, for kernels whose verifier does not offer
# bpf_get_socket_cookie to sock_addr programs. Identical enforcement, no
# SOCK_PIDS write. `observed` is blank because 7.1.8 verifies the cookie
# variants, so the loader never attaches these here and nothing measures them -
# the ceiling still applies on a kernel that does. Do not invent a number: the
# budget test panics on a measured program with no entry, never on an entry
# with no measurement.
[cfc_connect4_basic]
max = 200

[cfc_connect6_basic]
max = 200
