[workspace]
resolver = "2"
members = [
    "crates/cfc-core",
    "crates/cfc-proto",
    "crates/cfc-daemon",
    "crates/cfc-ui",
    "crates/cfc-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.78"
license = "GPL-3.0-or-later"
repository = "https://github.com/Project-Colony/Colony-Firewall-Control"
authors = ["MotherSphere <linhajahad@gmail.com>"]

[workspace.dependencies]
# IPC
tonic = "0.12"
prost = "0.13"
tonic-build = "0.12"

# Async runtime
tokio = { version = "1.40", features = ["full"] }
tokio-stream = "0.1"
futures = "0.3"

# Storage
rusqlite = { version = "0.32", features = ["bundled"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# Errors & logging
thiserror = "1.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Netfilter / proc
nfq = "0.2"
procfs = "0.17"

# Process / system
nix = { version = "0.29", features = ["process", "user", "signal"] }
libc = "0.2"

# UI
iced = { version = "0.13", features = ["tokio", "advanced", "image", "lazy"] }
notify-rust = "4.11"

# CLI
clap = { version = "4.5", features = ["derive"] }

# Utility
once_cell = "1.20"
parking_lot = "0.12"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.10", features = ["v4", "serde"] }
ipnet = { version = "2.10", features = ["serde"] }

[profile.dev]
opt-level = 0

[profile.fast]
inherits = "release"
opt-level = 3
lto = "thin"
codegen-units = 16
incremental = true
debug = "line-tables-only"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
