[workspace]
resolver = "2"
members = [
    "crates/cfc-core",
    "crates/cfc-proto",
    "crates/cfc-client",
    "crates/cfc-daemon",
    "crates/cfc-ui",
    "crates/cfc-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "GPL-3.0-or-later"
repository = "https://github.com/Project-Colony/Colony-Firewall-Control"
authors = ["MotherSphere <linhajahad@gmail.com>"]

[workspace.dependencies]
# IPC
tonic = "0.14"
prost = "0.14"
tonic-build = "0.14"
tonic-prost = "0.14"
tonic-prost-build = "0.14"

# Async runtime
tokio = { version = "1.52", features = ["full"] }
tokio-stream = { version = "0.1.18", features = ["net"] }
futures = "0.3"
hyper-util = { version = "0.1", features = ["tokio"] }
tower = { version = "0.5", features = ["util"] }

# Storage
rusqlite = { version = "0.39", features = ["bundled"] }

# Serialization
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
toml = "1.1"

# Errors & logging
thiserror = "2.0"
anyhow = "1.0.102"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

# Netfilter / proc
nfq = "0.2"
procfs = "0.18"

# DNS reverse lookup
dns-lookup = "2.0"

# Process / system
nix = { version = "0.31", features = ["process", "user", "signal"] }
libc = "0.2"

# UI
iced = { version = "0.14", features = ["tokio", "advanced", "image", "lazy"] }
notify-rust = "4.17"

# CLI
clap = { version = "4.6", features = ["derive"] }
owo-colors = { version = "4.2", features = ["supports-colors"] }

# Utility
once_cell = "1.21"
parking_lot = "0.12.5"
chrono = { version = "0.4.44", features = ["serde"] }
uuid = { version = "1.23", features = ["v4", "serde"] }
ipnet = { version = "2.12", features = ["serde"] }

[profile.dev]
opt-level = 0

[profile.fast]
inherits = "release"
opt-level = 3
lto = "thin"
codegen-units = 16
incremental = true
debug = "line-tables-only"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
