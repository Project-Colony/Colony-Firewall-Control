[workspace]
resolver = "2"
members = [
    "crates/cfc-core",
    "crates/cfc-proto",
    "crates/cfc-client",
    "crates/cfc-daemon",
    "crates/cfc-ui",
    "crates/cfc-cli",
    "crates/cfc-tray",
    "crates/cfc-ebpf-common",
    "crates/xtask",
]
# `crates/cfc-ebpf` is the kernel-side crate. It is built for
# `bpfel-unknown-none` with a pinned nightly + bpf-linker and declares its own
# `[workspace]`, so stable never sees it. `cargo xtask build-ebpf` drives it.
exclude = ["crates/cfc-ebpf"]

[workspace.package]
version = "0.2.0"
edition = "2021"
rust-version = "1.88"
license = "GPL-3.0-or-later"
repository = "https://github.com/Project-Colony/Colony-Firewall-Control"
authors = ["MotherSphere <linhajahad@gmail.com>"]

[workspace.dependencies]
# eBPF: POD event types + pure parsers shared with the kernel-side crate.
# Dependency-free and no_std-capable; the daemon consumes it with default
# (std) features for the string/IpAddr helpers.
cfc-ebpf-common = { path = "crates/cfc-ebpf-common" }
# Userspace half of the eBPF backend: loads the object built by
# `cargo xtask build-ebpf`, attaches it, and reads the ring buffers. An
# optional dependency of cfc-daemon behind its `ebpf` feature, which is ON by
# default -- so a plain `cargo build --workspace` does compile it. That costs
# nothing at runtime (the loader is not reached while `[ebpf] enabled` is off)
# and nothing at build time beyond aya itself: aya is pure Rust and needs no
# bpf-linker, no nightly and no BPF-capable kernel to compile. aya 0.14 pairs
# with the aya-ebpf 0.2.x the kernel-side crate uses, and declares
# rust-version 1.87, comfortably inside this workspace's 1.88 MSRV. The exact
# build is pinned by Cargo.lock plus `--locked` in CI, not by an `=` requirement
# (cargo expands `=0.14` to the same range as `0.14` for a 0.x version, so an
# `=` here would be a no-op that reads like a guarantee).
aya = "0.14"

# IPC
tonic = "0.14"
prost = "0.14"
tonic-build = "0.14"
tonic-prost = "0.14"
tonic-prost-build = "0.14"

# Async runtime
tokio = { version = "1.52", features = ["full"] }
tokio-stream = { version = "0.1.18", features = ["net"] }
futures = "0.3"
hyper-util = { version = "0.1", features = ["tokio"] }
tower = { version = "0.5", features = ["util"] }

# Storage
rusqlite = { version = "0.39", features = ["bundled"] }

# Serialization
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
toml = "1.1"

# Errors & logging
thiserror = "2.0"
anyhow = "1.0.102"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

# Netfilter / proc
nfq = "0.2"
procfs = "0.18"

# DNS reverse lookup
dns-lookup = "2.0"

# Process / system
nix = { version = "0.31", features = ["process", "user", "signal"] }
libc = "0.2"
sha2 = "0.11"

# UI
iced = { version = "0.14", features = ["tokio", "advanced", "image", "lazy"] }
# `images_no_default_features` gives us `Image` (embedded notification
# icons) without pulling the `image` crate's format decoders: we build
# the RGBA buffer ourselves and never decode a file.
notify-rust = { version = "4.17", features = ["images_no_default_features"] }
ksni = "0.3"

# CLI
clap = { version = "4.6", features = ["derive"] }
owo-colors = { version = "4.2", features = ["supports-colors"] }

# Utility
once_cell = "1.21"
parking_lot = "0.12.5"
chrono = { version = "0.4.44", features = ["serde"] }
uuid = { version = "1.23", features = ["v4", "serde"] }
ipnet = { version = "2.12", features = ["serde"] }

[profile.dev]
opt-level = 0

[profile.fast]
inherits = "release"
opt-level = 3
lto = "thin"
codegen-units = 16
incremental = true
debug = "line-tables-only"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
