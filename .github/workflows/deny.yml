name: deny

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly re-scan so newly published RustSec advisories are caught even
    # when no code is changing. Monday 06:00 UTC.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cargo-deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
          # Explicit, not inherited. aya arrives through the `ebpf` feature,
          # and whether an unqualified `check` scans optional dependencies is
          # an action default nobody here has pinned. Say --all-features so the
          # advisory scan provably covers the ring-0 layer's dependency tree.
          arguments: --all-features
