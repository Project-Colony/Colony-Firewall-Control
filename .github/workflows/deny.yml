name: deny

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly re-scan so newly published RustSec advisories are caught even
    # when no code is changing. Monday 06:00 UTC.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cargo-deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # cargo-deny runs on the runner with the pinned toolchain, not inside
      # the cargo-deny-action container, which does not ship the toolchain
      # that rust-toolchain.toml names.
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: "1.100.0"
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-deny@0.22.0
      # --all-features is explicit, not inherited. aya arrives through the
      # `ebpf` feature; say it so the advisory scan provably covers the ring-0
      # layer's dependency tree.
      - run: cargo deny --all-features check
