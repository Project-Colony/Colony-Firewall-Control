# RHEL-family packaging.
#
# Everything in `packaging/rpm` and `packaging/selinux` is written against a
# platform this project is not developed on, which is exactly the kind of file
# that rots without anyone noticing. Three things are checked here, and none
# is cosmetic:
#
#   1. the SELinux module *compiles* against the real `selinux-policy-devel` of
#      each release. That proves every type and interface it names exists
#      there - `bpf_t`, `rpm_exec_t`, `stream_connect_pattern` and the rest -
#      which is the failure mode a policy written away from the platform
#      actually has.
#   2. the spec parses and produces a source RPM, with `rpmlint` on top.
#   3. the package builds, installs and verifies end to end - in a Fedora
#      container, not on Rocky 9, because the workspace's MSRV is 1.88 and
#      Rocky 9's default repos do not reach it. The Rocky-native path
#      (`rust-toolset`) remains untried; TODO.md 2b says so rather than
#      letting a green Fedora build imply the deployment target can build it.
#
# What is deliberately NOT checked: that the rules are *sufficient*. That needs
# a running enforcing system with the daemon under load, and no amount of
# compiling proves it. `packaging/selinux/README.md` says so plainly, and
# `packaging/selinux/TESTING.md` is the protocol for whoever has such a host.

name: rhel

on:
  push:
    branches: [main]
    paths:
      - "packaging/**"
      - "systemd/**"
      - ".github/workflows/rhel.yml"
  pull_request:
    paths:
      - "packaging/**"
      - "systemd/**"
      - ".github/workflows/rhel.yml"
  # The policy names types from selinux-policy-devel, which moves under us
  # between releases. A weekly run catches a rename before a user does.
  schedule:
    - cron: "0 6 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  selinux:
    name: selinux (${{ matrix.name }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          # Rocky 9 is the deployment target. Fedora is the early warning: its
          # selinux-policy is where the next RHEL's will come from, so a type
          # this module names disappearing shows up here first.
          - name: rocky-9
            image: "rockylinux:9"
          - name: fedora-latest
            image: "fedora:latest"
    container:
      image: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the policy toolchain
        run: |
          set -eux
          # Rocky's `dnf` is `microdnf`-less and full; Fedora's is dnf5. Both
          # accept this form.
          dnf -y install make selinux-policy-devel bzip2

      - name: Build the module
        run: |
          set -eux
          cd packaging/selinux
          # Ground truth first: if the build below fails, this output is what
          # ends four rounds of guessing what these headers actually define.
          grep -n "interface(\`files_search_pids\|interface(\`files_search_runtime\|interface(\`files_pid_filetrans\|interface(\`files_runtime_filetrans" \
            /usr/share/selinux/devel/include/kernel/files.if || true
          make -f /usr/share/selinux/devel/Makefile colony_firewall.pp
          ls -l colony_firewall.pp

      - name: Show what the source declares
        # Nothing in this job LOADS the module: a container has no policy
        # store for `semodule` to install into, and `sedismod`/`sedispol` are
        # not packaged here. What is proven is the step above - the .pp
        # compiles and links against this release's headers - and nothing
        # more; loading and AVC behavior stay untested, exactly as the file
        # header says. This step only prints the source's type and allow
        # lines so a widened policy shows in a review diff. Grants that come
        # from interface macros expand only in the compiled .pp, so they are
        # not visible here either.
        run: |
          set -eux
          cd packaging/selinux
          grep -E '^\s*(type|allow)' colony_firewall.te | sed 's/^\s*//' | sort

      - name: Refuse a permissive escape hatch
        # A `permissive colony_firewalld_t` line would make this file look like
        # a policy while behaving like `setenforce 0` for one domain, and it is
        # the single most likely thing for someone to add while debugging an
        # AVC and forget to remove.
        run: |
          set -eux
          if grep -qE '^\s*permissive\b' packaging/selinux/colony_firewall.te; then
            echo "::error file=packaging/selinux/colony_firewall.te::a permissive domain defeats the whole module"
            exit 1
          fi

  spec:
    name: rpm spec
    runs-on: ubuntu-24.04
    container:
      image: "rockylinux:9"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install rpm tooling
        run: dnf -y install rpm-build rpmlint rpmdevtools

      - name: Parse the spec
        # `rpmspec -P` expands every macro. A spec that references a macro the
        # platform does not define - `%selinux_modules_install` is the obvious
        # candidate - fails here rather than halfway through someone's build.
        run: |
          set -eux
          rpmspec -P packaging/rpm/colony-firewall-control.spec > /dev/null
          rpmspec -q --qf '%{name}-%{version}-%{release}\n' \
            packaging/rpm/colony-firewall-control.spec

      - name: Build a source RPM
        run: |
          set -eux
          rpmdev-setuptree
          # `%prep` needs the tarball to exist even for a source RPM. Its
          # contents are irrelevant here: nothing is unpacked. The name is
          # derived from the spec rather than hardcoded - a hardcoded 0.2.0
          # here is what broke this job on the first real version bump, in the
          # one repo whose check-versions.sh exists to prevent exactly that.
          SRC="$(rpmspec -q --srpm --qf '%{name}-%{version}\n' packaging/rpm/colony-firewall-control.spec | head -1)"
          touch ~/rpmbuild/SOURCES/"${SRC}.tar.gz"
          rpmbuild -bs packaging/rpm/colony-firewall-control.spec
          ls -l ~/rpmbuild/SRPMS/

      - name: rpmlint
        # Advisory: rpmlint has opinions this package will not always share
        # (an unpackaged /usr/lib directory is intentional - it is where a
        # locally built BPF object goes). Failing the job on them would mean
        # arguing with a linter instead of packaging.
        continue-on-error: true
        run: rpmlint packaging/rpm/colony-firewall-control.spec

  rpm-end-to-end:
    name: rpm end to end (fedora)
    runs-on: ubuntu-24.04
    container:
      image: "fedora:latest"
    steps:
      - name: Install the build toolchain
        # Before checkout, unlike every sibling job, and the order matters:
        # this container ships no git, and actions/checkout without git falls
        # back to a REST API tarball that leaves no repository behind - which
        # the `git archive` two steps down would report as a confusing error
        # long after the real cause.
        #
        # The compiler half of this list mirrors the spec's BuildRequires
        # rather than replacing them: `rpmbuild -ba` re-checks BuildRequires
        # itself and refuses with the missing names, so if the spec grows a
        # dependency this list lacks, the failure names exactly what to add
        # here. make and bzip2 are the same additions the selinux job needs
        # for the module build; shadow-utils and util-linux are for the
        # unprivileged-builder steps below (the base image has useradd and su
        # only by accident, if at all).
        run: |
          set -eux
          dnf -y install \
            git-core rpm-build rpmdevtools \
            rust cargo protobuf-compiler pkgconf gcc \
            systemd-rpm-macros selinux-policy-devel make bzip2 \
            shadow-utils util-linux

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build the tarball %prep expects
        # Source0 is GitHub's /archive/v<version>/ tarball, which is exactly
        # a `git archive` with a `Colony-Firewall-Control-<version>/` prefix -
        # the directory the spec's `%autosetup -n` names. Reproduce that
        # instead of inventing a layout, so what is built here is what a
        # build from the released tarball would consume. The version comes
        # from the spec, not a hardcode - the source-RPM job's comment
        # records what a hardcoded version cost once already.
        run: |
          set -eux
          VERSION="$(rpmspec -q --srpm --qf '%{version}\n' packaging/rpm/colony-firewall-control.spec)"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          git archive --format=tar.gz \
            --prefix="Colony-Firewall-Control-${VERSION}/" \
            --output="colony-firewall-control-${VERSION}.tar.gz" HEAD
          tar tzf "colony-firewall-control-${VERSION}.tar.gz" | head -3

      - name: Set up an unprivileged build tree
        # Container steps run as root, and rpmbuild as root turns one class
        # of spec bug - an %install line writing outside %{buildroot} - into
        # silent edits of the container's real filesystem. A throwaway user
        # turns the same bug into an EACCES with a path in it.
        run: |
          set -eux
          useradd --create-home builder
          su builder -c 'rpmdev-setuptree'
          install -m 0644 -o builder -g builder \
            "colony-firewall-control-${VERSION}.tar.gz" /home/builder/rpmbuild/SOURCES/
          install -m 0644 -o builder -g builder \
            packaging/rpm/colony-firewall-control.spec /home/builder/rpmbuild/SPECS/

      - name: rpmbuild -ba
        # The pipeline the source-RPM job cannot claim: %prep unpacks the
        # tarball, %build compiles the workspace and the SELinux module,
        # %install lays out the buildroot (completions and man pages come out
        # of the just-built cfc), %check runs the test suite, and rpm packs
        # the lot. cargo fetches crates.io here - a distro build root would
        # vendor, but this job is about the spec, not about hermeticity.
        run: |
          set -eux
          su builder -c 'rpmbuild -ba ~/rpmbuild/SPECS/colony-firewall-control.spec'
          ls -l /home/builder/rpmbuild/RPMS/x86_64/ \
                /home/builder/rpmbuild/RPMS/noarch/ \
                /home/builder/rpmbuild/SRPMS/

      - name: Install what was built
        # Both packages in one transaction, so dnf resolves the spec's real
        # Requires: nftables, and Requires(post): systemd - which is what
        # lets %sysusers_create_compat do real work in %post instead of
        # failing into its `|| :`. The selinux subpackage drags
        # selinux-policy-targeted in, and its %post runs `semodule -n`: a
        # write into the on-disk module store, never a policy load. Loading
        # needs a kernel with SELinux, which a container does not get -
        # that half is exactly what packaging/selinux/TESTING.md exists for.
        run: |
          set -eux
          dnf -y install \
            /home/builder/rpmbuild/RPMS/x86_64/colony-firewall-control-[0-9]*.rpm \
            /home/builder/rpmbuild/RPMS/noarch/colony-firewall-control-selinux-*.rpm

      - name: Binaries exist and say the packaged version
        # --version only where clap provides it (the daemon and the CLI).
        # The GUI and tray are checked for presence and mode alone: neither
        # takes --version, and starting either headless tests a display
        # server, not a package.
        run: |
          set -eux
          test -x /usr/bin/colony-firewalld
          test -x /usr/bin/colony-firewall
          test -x /usr/bin/colony-firewall-tray
          test -x /usr/bin/cfc
          /usr/bin/colony-firewalld --version | grep -F "${VERSION}"
          /usr/bin/cfc --version | grep -F "${VERSION}"

      - name: Files landed where the units and macros put them
        # Nothing is enabled or started, deliberately: there is no systemd
        # running in here, and a fail-closed ruleset inside the job's own
        # network namespace is a self-inflicted outage. Presence is the
        # claim this step makes, and only presence.
        run: |
          set -eux
          test -f /usr/lib/systemd/system/colony-firewalld.service
          test -f /usr/lib/systemd/system/colony-firewall-nft.service
          test -f /usr/lib/systemd/system/colony-firewall-nft-inbound.service
          test -f /usr/lib/sysusers.d/colony-firewall.conf
          test -f /etc/colony-firewall/daemon.toml
          test -d /usr/lib/colony-firewall
          test -f /usr/share/selinux/packages/targeted/colony_firewall.pp.bz2
          # Printed, not asserted: whether `semodule -n` succeeds in a
          # container is a property of selinux-policy's store layout, not of
          # this package. The .pp.bz2 existence check above is the contract.
          semodule -l | grep colony_firewall || echo "module not in the store (container)"

      - name: Scriptlets did their work
        # %sysusers_create_compat ends in `|| :`, so a failure there is
        # silent by design. Either the group exists now or the scriptlet
        # swallowed something, and this is the step that refuses to let it.
        run: |
          set -eux
          getent group colony-firewall

      - name: rpm -V is clean
        # Mode, digest, size and mtime of everything packaged. A scriptlet
        # that edited a packaged file, or an %install/%files disagreement,
        # surfaces here as a one-letter code instead of on a user's machine.
        run: |
          set -eux
          rpm -V colony-firewall-control
          rpm -V colony-firewall-control-selinux

      - name: Keep the RPMs
        # The artifact is what lets the enforcing-host validation
        # (packaging/selinux/TESTING.md) start from an installable package
        # instead of a toolchain bootstrap. Fedora RPMs, so they fit a
        # Fedora VM; a Rocky 9 host still has to build by hand until
        # rust-toolset is tried.
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rpms-fedora
          path: |
            /home/builder/rpmbuild/RPMS/**/*.rpm
            /home/builder/rpmbuild/SRPMS/*.rpm
          if-no-files-found: error

  version-agrees:
    name: version agrees with Cargo.toml
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Compare
        # Three files now carry the version - Cargo.toml, the PKGBUILD and the
        # spec - and a release where they disagree ships a package whose name
        # lies about what is inside it.
        run: |
          set -eu
          cargo="$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
          pkgbuild="$(grep -m1 '^pkgver=' pkg/PKGBUILD | cut -d= -f2)"
          spec="$(grep -m1 '^Version:' packaging/rpm/colony-firewall-control.spec | awk '{print $2}')"
          echo "Cargo.toml=$cargo PKGBUILD=$pkgbuild spec=$spec"
          test "$cargo" = "$pkgbuild" || { echo "::error::PKGBUILD disagrees with Cargo.toml"; exit 1; }
          test "$cargo" = "$spec"     || { echo "::error::spec disagrees with Cargo.toml"; exit 1; }
