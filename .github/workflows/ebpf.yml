# FIRST-RUN NOTE. Every job below is written but has never executed - a
# workflow cannot be validated from a working tree. Treat the first push as the
# real test, and expect the items marked `VERIFY` to need one round of
# correction against real output.

name: ebpf

# The ring-0 layer's own gate. Split out of check.yml because it needs a
# pinned nightly, bpf-linker, a matching LLVM, and - for the interesting
# half - kernels that are not the runner's.
#
# What each job is for:
#
#   object        can the kernel-side crate still be built at all, and does the
#                 result contain what the loader looks up by name?
#   runner-kernel does it load and attach on a real, current kernel?
#   capabilities  does it do that WITHOUT CAP_SYS_ADMIN? (the claim the unit
#                 file makes)
#   vm            does it still do that on the kernels users actually run, and
#                 on mainline, so a future kernel breaking us is caught here
#                 rather than by them?

on:
  push:
    branches: [main]
    paths: &ebpf-paths
      - "crates/cfc-ebpf/**"
      - "crates/cfc-ebpf-common/**"
      - "crates/cfc-daemon/src/ebpf/**"
      - "crates/cfc-daemon/src/ebpf.rs"
      - "crates/xtask/**"
      - ".github/workflows/ebpf.yml"
  pull_request:
    branches: [main]
    paths: *ebpf-paths
  # Mainline moves whether or not this repo does, so the whole point of the
  # matrix is a run that happens without a push. Sunday 05:00 UTC.
  schedule:
    - cron: "0 5 * * 0"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # ---------------------------------------------------------------------------
  # Build the object once and hand it to every other job.
  # ---------------------------------------------------------------------------
  object:
    runs-on: ubuntu-24.04
    outputs:
      nightly: ${{ steps.pins.outputs.nightly }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read the toolchain pins
        id: pins
        run: |
          NIGHTLY="$(sed -n 's/^channel *= *"\(.*\)"/\1/p' crates/cfc-ebpf/rust-toolchain.toml)"
          LINKER="$(tr -d '[:space:]' < crates/cfc-ebpf/bpf-linker-version)"
          # An empty parse would install "latest" for both and produce an
          # object built by an unknown toolchain, which is worse than failing.
          if [ -z "${NIGHTLY}" ] || [ -z "${LINKER}" ]; then
            echo "::error::could not read the eBPF toolchain pins (nightly='${NIGHTLY}' bpf-linker='${LINKER}')"
            exit 1
          fi
          echo "nightly=${NIGHTLY}" >> "${GITHUB_OUTPUT}"
          echo "linker=${LINKER}" >> "${GITHUB_OUTPUT}"

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: ${{ steps.pins.outputs.nightly }}
          components: rust-src

      # Keyed on BOTH pins: bumping either one must invalidate this, or a
      # cached bpf-linker built against the old LLVM silently survives.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: bpf-${{ steps.pins.outputs.nightly }}-${{ steps.pins.outputs.linker }}

      # `llvm-dev` is whatever LLVM the runner image defaults to, and on
      # ubuntu-24.04 that is 18 — a version bpf-linker 0.11 dropped. The build
      # then found no libLLVM to link against and died with
      # `rust-lld: error: unable to find library -lLLVM`, which reads like a
      # path problem and is a version problem. The scheduled run failed this
      # way on 2026-08-23; the runner image moved, not mainline.
      #
      # The major is derived from the pinned nightly rather than written down.
      # It has to equal rustc's, because bpfel-unknown-none is obj-is-bitcode
      # and the assert below enforces exactly that — so a second hardcoded
      # number could only ever drift away from the first.
      - name: Install bpf-linker
        id: linker
        run: |
          # `rustup run <pin>`, never bare `rustc`: this step executes at the
          # repository root, where rust-toolchain.toml pins *stable*, and a
          # toolchain file outranks the default the toolchain action set. Bare
          # rustc here read stable's LLVM while claiming to read the nightly's
          # - harmless only for as long as the two majors happen to agree.
          LLVM_MAJOR="$(rustup run "${{ steps.pins.outputs.nightly }}" rustc -vV | sed -n 's/^LLVM version: \([0-9]*\).*/\1/p')"
          if [ -z "${LLVM_MAJOR}" ]; then
            echo "::error::could not read the pinned nightly's LLVM version"; exit 1
          fi
          echo "llvm_major=${LLVM_MAJOR}" >> "${GITHUB_OUTPUT}"
          echo "pinned nightly uses LLVM ${LLVM_MAJOR}; building bpf-linker against it"

          sudo apt-get update
          sudo apt-get install -y lsb-release wget software-properties-common gnupg
          wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh "${LLVM_MAJOR}"
          sudo apt-get install -y "llvm-${LLVM_MAJOR}-dev" "libpolly-${LLVM_MAJOR}-dev"

          # llvm-sys keys its prefix variable on the version it wraps: LLVM 22
          # is llvm-sys 221.x, hence LLVM_SYS_221_PREFIX.
          export "LLVM_SYS_${LLVM_MAJOR}1_PREFIX=/usr/lib/llvm-${LLVM_MAJOR}"
          export PATH="/usr/lib/llvm-${LLVM_MAJOR}/bin:${PATH}"
          cargo install bpf-linker --version "${{ steps.pins.outputs.linker }}" --locked \
            --no-default-features --features "llvm-${LLVM_MAJOR}"

      # `bpfel-unknown-none` sets obj-is-bitcode: rustc hands bpf-linker raw
      # LLVM bitcode, so rustc's LLVM must not be NEWER than bpf-linker's or
      # the link dies with `Invalid record`. Pinning the rustc that *compiles*
      # bpf-linker does not make this true - bpf-linker links whatever libLLVM
      # the system provides - so assert it rather than assume it.
      - name: Assert the LLVM versions pair
        run: |
          # Two real checks, replacing one that could never fire: the old
          # version came from `bpf-linker --version`, which prints no LLVM
          # version at all in 0.11, so the comparison was permanently vacuous
          # - and its rustc side read stable (see the install step).
          #
          # (1) The system LLVM the install step provided must actually be the
          #     major it asked llvm.sh for - the script can fall back when a
          #     major is not packaged for the runner's distro yet. Comparing
          #     the nightly's LLVM against itself would assert nothing; this
          #     compares it against what landed on disk.
          WANT="${{ steps.linker.outputs.llvm_major }}"
          GOT="$("/usr/lib/llvm-${WANT}/bin/llvm-config" --version 2>/dev/null | cut -d. -f1 || true)"
          echo "requested LLVM=${WANT}  system llvm-config says=${GOT}"
          if [ "${GOT}" != "${WANT}" ]; then
            echo "::error::asked apt.llvm.org for LLVM ${WANT} but /usr/lib/llvm-${WANT} answers '${GOT}' - the pinned nightly's LLVM is not installable here, so the bitcode handoff to bpf-linker will fail with 'Invalid record'. Bump crates/cfc-ebpf/bpf-linker-version or move the nightly pin back."
            exit 1
          fi
          # (2) What the installed binary actually links, read from the binary
          #     rather than believed from the build flags. A cached bpf-linker
          #     that survived a toolchain change is exactly what this catches.
          LINKED="$(ldd "$(command -v bpf-linker)" 2>/dev/null | grep -oE 'libLLVM[-.so]*[0-9]+' | grep -oE '[0-9]+$' | head -1 || true)"
          if [ -z "${LINKED}" ]; then
            echo "::warning::could not read a libLLVM major from the bpf-linker binary (static link or layout change); relying on check (1) only"
          elif [ "${LINKED}" != "${WANT}" ]; then
            echo "::error::bpf-linker links libLLVM ${LINKED} but was requested against LLVM ${WANT} - a stale cache or a wandering apt default"
            exit 1
          fi

      - name: Build and check the object
        run: |
          cargo xtask build-ebpf
          cargo xtask ebpf-check

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cfc-ebpf-object
          path: crates/cfc-ebpf/target/bpfel-unknown-none/release/cfc-ebpf.o
          if-no-files-found: error
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Load it for real on the runner's own kernel.
  # ---------------------------------------------------------------------------
  runner-kernel:
    needs: object
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler libnfnetlink-dev libnetfilter-queue-dev
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cfc-ebpf-object
          path: obj

      - run: uname -a

      # The test binds 127.0.0.1:53 to impersonate a resolver. Fail naming
      # whoever holds it rather than blindly stopping systemd-resolved.
      - name: Preflight - 127.0.0.1:53 must be free
        # The DNS probe binds 127.0.0.1:53 and nothing else, so that address is
        # the only one this check may claim. It used to refuse port 53 on ANY
        # address, and the runner image now ships systemd-resolved listening on
        # 127.0.0.53 and 127.0.0.54 - stub addresses that do not collide with
        # the probe's bind at all. That over-broad check is why this job has
        # been red on every branch since 2026-08-25 while the test it guards
        # would have passed.
        run: |
          if ss -lunp 'sport = :53' 2>/dev/null | tail -n +2 | grep -F '127.0.0.1:53' | grep -q .; then
            echo "::error::something is listening on udp 127.0.0.1:53 on this runner:"
            ss -lunp 'sport = :53'
            exit 1
          fi

      # Ask cargo where the binary is rather than globbing target/*/deps/*.
      # A glob picks up stale binaries from a previous compile and runs the
      # wrong one, silently.
      - name: Locate the test binary
        id: bin
        run: |
          echo "path=$(./scripts/ebpf-test-binary.sh)" >> "${GITHUB_OUTPUT}"

      - name: Load and attach
        env:
          # Two getent calls against a possibly-unreachable resolver cost ~40s
          # and assert nothing; the hermetic half of the test is the one that
          # must hold.
          CFC_SKIP_LIVE_RESOLUTION: "1"
        run: |
          sudo -E CFC_EBPF_OBJECT="${PWD}/obj/cfc-ebpf.o" \
            "${{ steps.bin.outputs.path }}" --ignored --nocapture --test-threads=1 \
            loads_and_attaches

  # ---------------------------------------------------------------------------
  # The claim systemd/colony-firewalld.service makes, tested.
  # ---------------------------------------------------------------------------
  capabilities:
    needs: object
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler libnfnetlink-dev libnetfilter-queue-dev util-linux
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cfc-ebpf-object
          path: obj

      - name: Locate the test binary
        id: bin
        run: |
          echo "path=$(./scripts/ebpf-test-binary.sh)" >> "${GITHUB_OUTPUT}"

      # dac_override is NOT a sixth grant the unit needs - it stands in for the
      # DAC bypass the daemon gets by running as uid 0, because /sys/kernel/
      # tracing is 0700 root. The test drops to a non-root uid precisely so
      # that capabilities are the only privilege in play, and refuses to pass
      # if it finds itself running as root or holding CAP_SYS_ADMIN.
      - name: Attach with the unit's capabilities and no CAP_SYS_ADMIN
        run: |
          CAPS='+net_admin,+net_raw,+sys_ptrace,+bpf,+perfmon,+dac_override'
          sudo setpriv --reuid="$(id -u)" --regid="$(id -g)" --clear-groups \
            --bounding-set "-all,${CAPS}" --inh-caps "${CAPS}" --ambient-caps "${CAPS}" \
            env CFC_EBPF_OBJECT="${PWD}/obj/cfc-ebpf.o" \
            "${{ steps.bin.outputs.path }}" --ignored --nocapture --test-threads=1 \
            only_the_units_capabilities

  # ---------------------------------------------------------------------------
  # The kernels users actually run, plus mainline.
  # ---------------------------------------------------------------------------
  vm:
    needs: object
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          # Roles, not an arbitrary spread:
          #   5.10  stands in for RHEL 9 / Rocky 9, which ship 5.14 with heavy
          #         backports. Deliberately *below* their base version: a
          #         kernel whose number says almost nothing about which BPF
          #         features it has is exactly the shape that surprises people,
          #         and passing under 5.10 means passing under anything they
          #         backported onto 5.14. Note this kernel predates 5.16, so it
          #         does not report verified instruction counts at all - the
          #         budget assertion simply has nothing to check there, which is
          #         itself worth exercising.
          #   6.12  the oldest LTS worth supporting today
          #   6.18  the newest LTS
          #   7.1   the kernel every verified-instruction number in
          #         crates/cfc-ebpf/README.md was measured on
          #   main  the whole point: catch a future kernel breaking us here
          #         rather than on a user's machine
          #
          # Pinned by digest, like every action in this repo: this job pulls a
          # third-party image and executes the kernel binary inside it, in a
          # job that also has the repo checkout. These are the OCI *index*
          # digests, so the amd64 child is still selected normally.
          - kernel: "5.10"
            role: rhel-floor
            image: "ghcr.io/cilium/ci-kernels@sha256:0bcfd9e526eeb684cd0eb30e1591f9fc2901683ee535ec70a66d109f848bbd2b"
          - kernel: "6.12"
            role: floor-lts
            image: "ghcr.io/cilium/ci-kernels@sha256:2932ba4cae93bd6503b3e5b51873e69ed273ee7ddfa89718c2d21c9951f2ccb4"
          - kernel: "6.18"
            role: newest-lts
            image: "ghcr.io/cilium/ci-kernels@sha256:efb63968666d35c0e9890135affbd95b29d1e3df82ebdc31456b1033a652d319"
          - kernel: "7.1"
            role: measured-on
            image: "ghcr.io/cilium/ci-kernels@sha256:50de8eeb1ebba78b98423463d1bdf8ebd34bd70e156ce68081498b56e4aca164"
          # DELIBERATELY NOT PINNED. Every other entry is pinned for supply
          # chain integrity; this one exists precisely to test against a moving
          # target, and a digest would freeze it at whatever mainline was the
          # day this line was written - which is the one outcome that makes the
          # job pointless. It runs unpinned and untrusted-by-design, which is
          # why it is continue-on-error on PRs.
          - kernel: "mainline"
            role: future
            image: "ghcr.io/cilium/ci-kernels:mainline"
    # Mainline is expected to break sometimes and must not redden a PR that did
    # not cause it. On the schedule it is a real failure worth an issue.
    continue-on-error: ${{ matrix.kernel == 'mainline' && github.event_name != 'schedule' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler libnfnetlink-dev \
            libnetfilter-queue-dev qemu-system-x86 cpio busybox-static
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cfc-ebpf-object
          path: obj

      - name: Locate the test binary
        id: bin
        run: |
          echo "path=$(./scripts/ebpf-test-binary.sh)" >> "${GITHUB_OUTPUT}"

      # `/boot/vmlinuz` confirmed by listing the image's own layer against the
      # registry, not assumed: the 7.1 image's first layer is
      # `boot/vmlinuz` + `usr/lib/modules/7.1.1/...`.
      - name: Fetch the kernel
        run: |
          set -euo pipefail
          # The trailing word is load-bearing. ci-kernels images are file
          # carriers with no CMD, and the docker shipped in runner images since
          # 2026-08-23 refuses `docker create` without a command ("no command
          # specified") - which broke all five matrix entries at once. create
          # never executes the command, so any word satisfies it. The same
          # docker also began rejecting single-character container names
          # ("Invalid container name (k)"), hence the longer name - two
          # environment breakages stacked on one line.
          docker create --name kernelsrc "${{ matrix.image }}" unused
          docker cp kernelsrc:/boot/vmlinuz ./vmlinuz
          docker rm kernelsrc
          ls -l ./vmlinuz
          file ./vmlinuz || true

      # docker export -> cpio builds a full-rootfs initramfs, so the guest
      # needs NO filesystem driver at all: the kernel unpacks it into ramfs
      # and runs /init. This replaced an ext4 disk image after the guest's own
      # panic message listed what these kernels can actually mount -
      # "No filesystem could mount root, tried: vfat msdos iso9660". The
      # previous comment here claimed ext4 was built in; nobody had checked,
      # and the matrix had never once been green. An earlier revision also
      # rejected "an initramfs" on the belief it implied 9p/virtiofs modules -
      # backwards: a self-contained initramfs is exactly what removes every
      # driver requirement.
      - name: Build the guest rootfs
        run: |
          set -euo pipefail
          mkdir -p rootfs
          # trixie, not bookworm, and the constraint is the builder's glibc:
          # the test binary is compiled on the ubuntu-noble runner (glibc 2.39)
          # and bookworm's 2.36 refuses to load it - the guest said so plainly
          # once it had a console: "version GLIBC_2.39 not found". The guest
          # userland must be at least as new as the build host's.
          docker create --name rfs debian:trixie-slim
          docker export rfs | tar -C rootfs -xf -
          docker rm rfs

          install -D -m0755 "${{ steps.bin.outputs.path }}" rootfs/cfc-test
          # Static busybox from the runner: trixie-slim ships neither ip nor
          # ifconfig, so the init line that brings loopback up was failing into
          # its own `|| true` - and the DNS probe then got ENETUNREACH on
          # 127.0.0.1. A static binary owes the guest libc nothing.
          install -D -m0755 "$(command -v busybox)" rootfs/busybox
          install -D -m0644 obj/cfc-ebpf.o rootfs/cfc-ebpf.o

          cat > rootfs/init <<'INIT'
          #!/bin/sh
          # Minimal PID 1. Everything the loader touches has to be mounted here:
          # tracefs for the tracepoint id/format files, cgroup2 for the DNS
          # program's attach point, sysfs for /sys/kernel/btf/vmlinux.
          #
          # /dev FIRST, then grab the console. A docker-export rootfs has no
          # device nodes (tar cannot mknod unprivileged), so until devtmpfs is
          # mounted this script runs with no stdout at all - an entire round of
          # this matrix executed invisibly and died on its last line, and the
          # only witness was exit_group(127) in the panic's register dump.
          mount -t devtmpfs devtmpfs /dev
          exec > /dev/console 2>&1
          set -x
          mount -t proc proc /proc
          mount -t sysfs sysfs /sys
          mount -t tmpfs tmpfs /tmp
          mount -t tracefs tracefs /sys/kernel/tracing 2>/dev/null || \
            mount -t debugfs debugfs /sys/kernel/debug
          mount -t cgroup2 cgroup2 /sys/fs/cgroup
          /busybox ip link set lo up

          echo "guest glibc: $(ldd --version 2>&1 | head -1)"
          echo "guest kernel: $(uname -r)"

          # CFC_SKIP_LIVE_RESOLUTION: the live-resolver block asserts nothing
          # here (no uplink) and stays fast only by the accident of an empty
          # resolv.conf failing on ECONNREFUSED. A rootfs that ever named an
          # unreachable resolver would stall 40s per kernel in TCG. Skip it
          # the way runner-kernel does; the hermetic DNS test still runs.
          CFC_EBPF_OBJECT=/cfc-ebpf.o CFC_SKIP_LIVE_RESOLUTION=1 \
            /cfc-test --ignored --nocapture \
            --test-threads=1 loads_and_attaches
          echo "CFC_EXIT=$?"
          # No poweroff: bookworm-slim ships no init system, so the binary does
          # not exist - it was the 127 that killed PID 1 above. Exiting is the
          # shutdown mechanism here: panic=1 reboots when init dies, and qemu's
          # -no-reboot turns that reboot into an exit. The marker is already out.
          exit 0
          INIT
          chmod +x rootfs/init

          # newc is the format the kernel's initramfs unpacker speaks;
          # --owner=0:0 because the runner user's uid must not leak into the
          # guest's idea of who owns /init. gzip -1: this is unpacked once.
          (cd rootfs && find . | cpio -o -H newc --owner=0:0 | gzip -1) > rootfs.cpio.gz
          ls -lh rootfs.cpio.gz

      - name: Boot and run
        run: |
          set -euo pipefail
          START=$(date +%s)
          # qemu's exit code is not the verdict; the CFC_EXIT marker below is.
          # The shutdown here is a deliberate panic (init exits under panic=1)
          # and how qemu reports the resulting reset request varies by guest
          # kernel: the 6.x reboot path exits 0, the 5.10 one exits 1, for the
          # same healthy shutdown. A hang or a crashed qemu is still caught -
          # either way the marker never got printed.
          QEMU_RC=0
          timeout 600 qemu-system-x86_64 \
            -nographic -no-reboot -m 2G -smp 2 \
            -kernel ./vmlinuz \
            -initrd rootfs.cpio.gz \
            -append "rdinit=/init console=ttyS0 panic=1" \
            | tee guest.log || QEMU_RC=$?
          ELAPSED=$(( $(date +%s) - START ))
          echo "qemu exit: ${QEMU_RC} (informational)"

          # A guest that never printed the marker did not run the test - a
          # boot failure must not read as a pass.
          if ! grep -q 'CFC_EXIT=' guest.log; then
            echo "::error::the guest never reached the test (no CFC_EXIT marker)"
            exit 1
          fi
          CODE="$(sed -n 's/.*CFC_EXIT=\([0-9]*\).*/\1/p' guest.log | tail -1)"

          # CFC_EXIT=0 is necessary but not sufficient: a test filter that
          # matches nothing (a renamed test, a typo in the init script) exits 0
          # having run zero tests, and the guest would print a green marker
          # around an empty suite. Require at least one test to have passed.
          if [ "${CODE}" = "0" ] && ! grep -qE 'test result: ok\. [1-9][0-9]* passed' guest.log; then
            echo "::error::the guest exited 0 but no test actually ran - the name filter matched nothing"
            exit 1
          fi

          {
            echo "### kernel ${{ matrix.kernel }} (${{ matrix.role }})"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| exit | ${CODE} |"
            echo "| boot+test wall clock | ${ELAPSED}s |"
            # `|| true`: kernels before 5.16 report no verified-insn counts,
            # so on 5.10 this grep matches nothing - which under pipefail was
            # exit 1, and as the last command of this group it took the whole
            # step down after the suite had already passed. Same lesson as the
            # test assertion this round fixed: no counts is what an old kernel
            # reporting honestly looks like.
            grep -o 'verified_insns: [^ ]* = [0-9]*' guest.log | while read -r _ p _ n; do
              echo "| \`${p}\` verified insns | ${n} |"
            done || true
          } >> "${GITHUB_STEP_SUMMARY}"

          # Wall clock, not just instruction count. They are different
          # quantities, and after ebpf::start moved behind READY=1 it is the
          # wall clock that decides whether automatic mode is safe on a boot
          # path. 120s is generous for a VM; a real regression is 10x.
          if [ "${ELAPSED}" -gt 120 ]; then
            echo "::warning::boot+test took ${ELAPSED}s"
          fi
          exit "${CODE}"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: guest-log-${{ matrix.kernel }}
          path: guest.log
          if-no-files-found: warn

  # A scheduled mainline failure is a real finding and must not sink silently
  # into a red square nobody looks at on a Sunday.
  mainline-alert:
    needs: vm
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const title = 'ebpf: the kernel matrix failed on the scheduled run';
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'ebpf-matrix',
            });
            if (existing.data.length > 0) return;
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title,
              labels: ['ebpf-matrix'],
              body: `The scheduled eBPF kernel matrix failed.\n\n` +
                    `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n\n` +
                    `Mainline moving is the expected cause. Check the guest-log-* artifacts ` +
                    `for which kernel and which program.`,
            });
