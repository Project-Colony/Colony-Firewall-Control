name: smoke

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler libnfnetlink-dev libnetfilter-queue-dev
      - uses: Swatinem/rust-cache@v2
      - name: Run smoke test
        run: ./scripts/smoke-test.sh
