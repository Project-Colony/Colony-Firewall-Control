name: check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
          components: rustfmt
      - run: cargo fmt --all -- --check

  versions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Check version consistency (Cargo.toml / PKGBUILD / colony.json)
        run: ./scripts/check-versions.sh

  # Guards the release tarball against pkg/colony.json: every file the
  # manifest's postInstall installs has to be staged by release.yml, or the
  # Colony channel silently ships without it (this is how the sysusers
  # fragment went missing and left the control socket root-only).
  release-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Check release assets against pkg/colony.json
        run: ./scripts/check-release-assets.sh

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
          components: clippy
      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler libnfnetlink-dev libnetfilter-queue-dev
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler libnfnetlink-dev libnetfilter-queue-dev
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo test --workspace --locked --no-fail-fast

  # The eBPF loader is compiled in by default, so `--no-default-features` is now
  # the configuration nothing else in CI exercises -- and it is the one that
  # keeps the promise that the firewall builds and runs with no eBPF support at
  # all. Without this job the `#[cfg(not(feature = "ebpf"))]` arm in
  # src/ebpf.rs is compiled by nothing and rots silently.
  #
  # Package-scoped on purpose. An unscoped `--workspace --no-default-features`
  # would also strip `default = ["std"]` from cfc-ebpf-common, which builds
  # today only because feature unification puts it back.
  no-ebpf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
          components: clippy
      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler libnfnetlink-dev libnetfilter-queue-dev
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo clippy -p cfc-daemon --no-default-features --all-targets --locked -- -D warnings
      - run: cargo test -p cfc-daemon --no-default-features --locked --no-fail-fast

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler libnfnetlink-dev libnetfilter-queue-dev
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo build --workspace --profile fast --locked

  # Compile the true release profile (fat LTO, codegen-units=1, panic=abort)
  # so breakage specific to it is caught before tagging a release.
  release-profile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable
      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler libnfnetlink-dev libnetfilter-queue-dev
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo build --workspace --profile release --locked

  # Verify the declared MSRV (rust-version in Cargo.toml). 1.88 is the
  # floor imposed by the current lockfile (wgpu 27 needs 1.88; zvariant
  # needs 1.87; edition-2024 crates need 1.85) — verified by compiling the
  # whole workspace with each candidate toolchain.
  #
  # RUSTUP_TOOLCHAIN is what actually pins this job. dtolnay/rust-toolchain
  # only runs `rustup default <toolchain>`, and the repo's root
  # rust-toolchain.toml (channel = "stable") outranks the rustup default in
  # rustup's override precedence — so `toolchain: "1.88"` alone silently
  # tested stable. The env var outranks rust-toolchain.toml, and the
  # assertion step below makes a future regression loud instead of silent.
  msrv:
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: "1.88"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: "1.88"
      - name: Assert the toolchain in use really is the MSRV
        run: |
          # Keep in sync with rust-version in [workspace.package].
          EXPECTED="$(sed -n '/^\[workspace\.package\]/,/^\[/{s/^rust-version *= *"\(.*\)"/\1/p}' Cargo.toml | head -n1)"
          if [ -z "${EXPECTED}" ]; then
            echo "::error::could not read rust-version from Cargo.toml [workspace.package]"
            exit 1
          fi
          if [ "${EXPECTED}" != "${RUSTUP_TOOLCHAIN}" ]; then
            echo "::error::Cargo.toml rust-version is ${EXPECTED} but this job pins RUSTUP_TOOLCHAIN=${RUSTUP_TOOLCHAIN}; update the job."
            exit 1
          fi
          rustc --version
          cargo --version
          if ! rustc --version | grep -qE "^rustc ${EXPECTED}\.[0-9]+ "; then
            echo "::error::MSRV job is not running ${EXPECTED}: $(rustc --version). The toolchain pin is not taking effect."
            exit 1
          fi
          echo "MSRV gate active: $(rustc --version)"
      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler libnfnetlink-dev libnetfilter-queue-dev
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo check --workspace --locked

  # Static validation of the Arch packaging. Fast, deterministic, and a
  # hard gate: syntax, .SRCINFO generation and namcap need no network and
  # no compiler.
  packaging-lint:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install lint deps
        run: pacman -Syu --noconfirm --needed namcap shellcheck

      - name: Prepare unprivileged build user
        run: |
          useradd -m builder
          chown -R builder: .

      - name: Shell syntax (PKGBUILDs, install scriptlet, scripts/)
        run: |
          for f in pkg/PKGBUILD pkg/PKGBUILD-git pkg/colony-firewall-control.install scripts/*.sh; do
            echo "bash -n ${f}"
            bash -n "${f}"
          done
          # The PKGBUILDs must be sourceable: makepkg sources them before
          # it does anything else.
          bash -c 'source pkg/PKGBUILD    && [ -n "$pkgname" ] && [ -n "$pkgver" ]'
          bash -c 'source pkg/PKGBUILD-git && [ -n "$pkgname" ]'

      - name: shellcheck the install scriptlet
        run: |
          # The scriptlet is sourced by pacman as a set of shell functions,
          # hence -s bash with the function-body shell dialect.
          shellcheck --shell=bash --severity=warning pkg/colony-firewall-control.install

      - name: makepkg --printsrcinfo (both recipes)
        working-directory: pkg
        run: |
          runuser -u builder -- makepkg --printsrcinfo -p PKGBUILD     | tee /tmp/srcinfo-release
          runuser -u builder -- makepkg --printsrcinfo -p PKGBUILD-git | tee /tmp/srcinfo-git
          grep -q '^pkgbase = colony-firewall-control$'     /tmp/srcinfo-release
          grep -q '^pkgbase = colony-firewall-control-git$' /tmp/srcinfo-git

      - name: namcap both PKGBUILDs
        run: |
          namcap pkg/PKGBUILD     | tee /tmp/namcap-release
          namcap pkg/PKGBUILD-git | tee /tmp/namcap-git
          # Warnings are advisory (namcap flags plenty of style nits on
          # cargo packages); errors are not.
          if grep -q ' E: ' /tmp/namcap-release /tmp/namcap-git; then
            echo "::error::namcap reported errors in a PKGBUILD"
            exit 1
          fi

  # Actually build the package from THIS checkout, using the -git recipe
  # pointed at the local repository. This is the only job that exercises
  # build() + package() — the completions/man generation, the install
  # paths, the .install scriptlet — without needing a published tag, which
  # is why the tag-only, continue-on-error job in release.yml never caught
  # anything. Hard gate.
  pkgbuild-build:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # makepkg clones the source with `git clone --mirror`, which
          # refuses to read a shallow repository.
          fetch-depth: 0

      - name: Install Arch build deps
        run: |
          # Both makedepends and depends: without -s, makepkg aborts on any
          # missing dependency rather than installing it.
          #
          # This list MIRRORS pkg/PKGBUILD-git. Adding an entry to depends= there
          # and not here fails the job with "Could not resolve all dependencies"
          # — which is how hicolor-icon-theme announced itself.
          pacman -Syu --noconfirm --needed \
            rust protobuf pkgconf git \
            nftables libxkbcommon wayland hicolor-icon-theme

      - name: Prepare the -git recipe against the local checkout
        run: |
          useradd -m builder
          install -d -o builder -g builder /build
          cp pkg/PKGBUILD-git /build/PKGBUILD
          cp pkg/colony-firewall-control.install /build/
          # Package this commit instead of GitHub's HEAD, so a PR is
          # validated against its own tree.
          sed -i "s|^_giturl=.*|_giturl=\"git+file://${GITHUB_WORKSPACE}#commit=${GITHUB_SHA}\"|" /build/PKGBUILD
          grep '^_giturl=' /build/PKGBUILD
          chown -R builder: /build "${GITHUB_WORKSPACE}"
          runuser -u builder -- git config --global --add safe.directory "${GITHUB_WORKSPACE}"

      - name: makepkg (build + package)
        run: |
          # --nocheck: check() re-runs the workspace test suite, already
          # gated by the `test` job above.
          runuser -u builder -- bash -c 'cd /build && makepkg --noconfirm --nocheck'
          ls -l /build/*.pkg.tar.*

      - name: Assert the package contains what the docs promise
        run: |
          # Skip any split -debug package makepkg's default OPTIONS emit.
          pkg=$(find /build -maxdepth 1 -name '*.pkg.tar.*' ! -name '*-debug-*' | head -n1)
          if [ -z "${pkg}" ]; then
            echo "::error::makepkg produced no package"
            exit 1
          fi
          bsdtar -tf "${pkg}" | sort | tee /tmp/pkg-contents
          missing=0
          while read -r want; do
            if ! grep -Fxq "${want}" /tmp/pkg-contents; then
              echo "::error::package is missing ${want}"
              missing=1
            fi
          done <<'EOF'
          usr/bin/cfc
          usr/bin/colony-firewall
          usr/bin/colony-firewalld
          usr/lib/systemd/system/colony-firewalld.service
          usr/lib/systemd/system/colony-firewall-nft.service
          usr/lib/systemd/system/colony-firewall-nft-inbound.service
          usr/lib/sysusers.d/colony-firewall.conf
          usr/share/colony-firewall/nftables-snippet.conf
          usr/share/colony-firewall/nftables-inbound.conf
          usr/lib/colony-firewall/inbound-lockout-guard.sh
          usr/share/applications/colony-firewall.desktop
          etc/xdg/autostart/colony-firewall.desktop
          usr/share/icons/hicolor/scalable/apps/colony-firewall.svg
          etc/colony-firewall/daemon.toml
          usr/share/doc/colony-firewall-control-git/TROUBLESHOOTING.md
          EOF
          exit "${missing}"
