name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Resolve version and verify it matches the tag
        id: version
        run: |
          VERSION="$(sed -n '/^\[workspace\.package\]/,/^\[/{s/^version *= *"\(.*\)"/\1/p}' Cargo.toml | head -n1)"
          if [ -z "${VERSION}" ]; then
            echo "::error::could not extract version from Cargo.toml [workspace.package]"
            exit 1
          fi
          # The release is named after the tag, but every asset filename is
          # built from the Cargo version. A mismatch publishes "v0.3.0"
          # containing colony-firewall-control-0.2.0-*.tar.zst. Refuse.
          if [ "${{ github.ref_type }}" = "tag" ] && [ "${{ github.ref_name }}" != "v${VERSION}" ]; then
            echo "::error::tag ${{ github.ref_name }} does not match Cargo.toml [workspace.package] version ${VERSION} (expected tag v${VERSION}). Bump Cargo.toml or retag."
            exit 1
          fi
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "Releasing ${VERSION}"

      # Same gates as check.yml, re-run here so a tag can never publish a
      # tarball that the packaging channels cannot install from.
      - name: Check version consistency (Cargo.toml / PKGBUILD / colony.json)
        run: ./scripts/check-versions.sh

      - name: Check release assets against pkg/colony.json
        run: ./scripts/check-release-assets.sh

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler libnfnetlink-dev libnetfilter-queue-dev zstd

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Build (release profile)
        run: cargo build --workspace --profile release --locked

      - name: Assemble tarball
        id: assemble
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          NAME="colony-firewall-control-${VERSION}-linux-x86_64"
          STAGE="$(mktemp -d)/${NAME}"
          mkdir -p "${STAGE}"

          install -m755 \
            target/release/colony-firewalld \
            target/release/colony-firewall \
            target/release/colony-firewall-tray \
            target/release/cfc \
            "${STAGE}/"

          # Everything pkg/colony.json's postInstall installs. The tarball
          # layout is FLAT: postInstall runs with the extracted directory
          # as its working directory, so each file must be present under
          # its own basename. scripts/check-release-assets.sh gates this
          # list against the manifest on every push, so a file added to
          # postInstall but not staged here fails CI instead of silently
          # vanishing on the Colony channel.
          install -m644 \
            systemd/colony-firewalld.service \
            systemd/colony-firewall-nft.service \
            systemd/colony-firewall.sysusers \
            systemd/daemon.toml.sample \
            systemd/nftables-snippet.conf \
            pkg/colony-firewall.desktop \
            pkg/colony-firewall-autostart.desktop \
            pkg/colony-firewall-tray-autostart.desktop \
            pkg/colony-firewall.svg \
            "${STAGE}/"

          # Docs, for parity with what the AUR package puts in
          # /usr/share/doc. `cfc status` points users at TROUBLESHOOTING.md
          # by name, so it has to actually ship.
          install -m644 \
            README.md \
            CHANGELOG.md \
            LICENSE \
            docs/ARCHITECTURE.md \
            docs/HARDENING.md \
            docs/TROUBLESHOOTING.md \
            "${STAGE}/"

          tar --zstd -C "$(dirname "${STAGE}")" -cf "${NAME}.tar.zst" "${NAME}"
          sha256sum "${NAME}.tar.zst" > SHA256SUMS

          echo "tarball=${NAME}.tar.zst" >> "${GITHUB_OUTPUT}"
          tar --zstd -tf "${NAME}.tar.zst"

      - name: Extract release notes from CHANGELOG.md
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          awk -v ver="${VERSION}" '
            $0 ~ ("^## \\[" ver "\\]") { in_section = 1; next }
            /^## \[/ { if (in_section) exit }
            in_section { print }
          ' CHANGELOG.md > RELEASE_BODY.md
          if [ ! -s RELEASE_BODY.md ]; then
            # On a tag this is fatal: falling back to the whole changelog
            # publishes the previous release's notes under the new version.
            if [ "${{ github.ref_type }}" = "tag" ]; then
              echo "::error::CHANGELOG.md has no '## [${VERSION}]' section - refusing to publish a release with the wrong notes. Rename the [Unreleased] section to [${VERSION}]."
              exit 1
            fi
            echo "::warning::No CHANGELOG section for ${VERSION}; using the full changelog."
            cp CHANGELOG.md RELEASE_BODY.md
          fi

      - name: Create draft release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          draft: true
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', steps.version.outputs.version) }}
          name: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', steps.version.outputs.version) }}
          body_path: RELEASE_BODY.md
          files: |
            ${{ steps.assemble.outputs.tarball }}
            SHA256SUMS

  # Build pkg/PKGBUILD for real against the freshly pushed tag, and produce
  # the AUR-submittable artifacts (PKGBUILD with real checksums + .SRCINFO).
  #
  # Hard gate, no continue-on-error: at tag time the source= URL
  # (.../archive/v$pkgver.tar.gz) resolves, because GitHub generates the
  # archive as soon as the tag exists. Skipped on workflow_dispatch, where
  # there is no tag for the source array to point at.
  pkgbuild:
    if: github.ref_type == 'tag'
    # Sequenced after `build` so the draft release already exists when the
    # AUR artifacts are attached to it, and so a broken build does not
    # spend half an hour compiling twice.
    needs: build
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install Arch build deps
        run: |
          # Both makedepends and depends: without -s, makepkg aborts on any
          # missing dependency rather than installing it. pacman-contrib
          # provides updpkgsums.
          pacman -Syu --noconfirm --needed \
            rust protobuf pkgconf git \
            nftables libxkbcommon wayland \
            namcap pacman-contrib

      - name: Prepare unprivileged build user
        run: |
          useradd -m builder
          chown -R builder: .

      - name: Verify pkgver matches the tag
        run: |
          PKGVER="$(sed -n 's/^pkgver=//p' pkg/PKGBUILD | head -n1)"
          if [ "${{ github.ref_name }}" != "v${PKGVER}" ]; then
            echo "::error::pkg/PKGBUILD pkgver=${PKGVER} does not match tag ${{ github.ref_name }}"
            exit 1
          fi

      - name: updpkgsums - replace the SKIP placeholder with real checksums
        working-directory: pkg
        run: |
          runuser -u builder -- updpkgsums PKGBUILD
          # A remote (non-VCS) source with sha256sums=('SKIP') is not
          # acceptable AUR practice: it disables integrity checking of the
          # release tarball entirely.
          if grep -qE "^sha256sums=\(.*'SKIP'" PKGBUILD; then
            echo "::error::pkg/PKGBUILD still has a SKIP checksum after updpkgsums"
            exit 1
          fi
          grep -A2 '^sha256sums=' PKGBUILD

      - name: Generate .SRCINFO
        working-directory: pkg
        run: runuser -u builder -- makepkg --printsrcinfo | tee .SRCINFO

      - name: namcap the PKGBUILD
        working-directory: pkg
        run: |
          namcap PKGBUILD | tee namcap.log
          # Warnings are advisory; errors are not.
          if grep -q ' E: ' namcap.log; then
            echo "::error::namcap reported errors in pkg/PKGBUILD"
            exit 1
          fi

      - name: Build the package (makepkg)
        working-directory: pkg
        run: |
          # --nocheck: check() re-runs the workspace test suite, which the
          # `test` job in check.yml already gates. Deps are preinstalled
          # above, so -s is not needed (and makepkg cannot sudo here).
          runuser -u builder -- makepkg --noconfirm --nocheck
          ls -l ./*.pkg.tar.*

      - name: namcap the built package
        working-directory: pkg
        run: |
          namcap ./*.pkg.tar.* | tee namcap-pkg.log
          if grep -q ' E: ' namcap-pkg.log; then
            echo "::error::namcap reported errors in the built package"
            exit 1
          fi

      - name: Attach AUR artifacts to the release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          draft: true
          tag_name: ${{ github.ref_name }}
          files: |
            pkg/PKGBUILD
            pkg/.SRCINFO
