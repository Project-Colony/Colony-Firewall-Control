name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve version and verify it matches the tag
        id: version
        run: |
          VERSION="$(sed -n '/^\[workspace\.package\]/,/^\[/{s/^version *= *"\(.*\)"/\1/p}' Cargo.toml | head -n1)"
          if [ -z "${VERSION}" ]; then
            echo "::error::could not extract version from Cargo.toml [workspace.package]"
            exit 1
          fi
          # The release is named after the tag, but every asset filename is
          # built from the Cargo version. A mismatch publishes "v0.3.0"
          # containing colony-firewall-control-0.2.0-*.tar.zst. Refuse.
          if [ "${{ github.ref_type }}" = "tag" ] && [ "${{ github.ref_name }}" != "v${VERSION}" ]; then
            echo "::error::tag ${{ github.ref_name }} does not match Cargo.toml [workspace.package] version ${VERSION} (expected tag v${VERSION}). Bump Cargo.toml or retag."
            exit 1
          fi
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "Releasing ${VERSION}"

      # Same gates as check.yml, re-run here so a tag can never publish a
      # tarball that the packaging channels cannot install from.
      - name: Check version consistency (Cargo.toml / PKGBUILD / colony.json)
        run: ./scripts/check-versions.sh

      - name: Check release assets against pkg/colony.json
        run: ./scripts/check-release-assets.sh

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: stable

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler libnfnetlink-dev libnetfilter-queue-dev zstd

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Build (release profile)
        run: cargo build --workspace --profile release --locked

      # The kernel-side BPF object. Built here rather than in makepkg because
      # on Arch `rustup` conflicts with `rust`, which the packaging containers
      # install -- without rustup the crate's rust-toolchain.toml is inert and
      # `-Z build-std` dies on stable.
      - name: Read the eBPF toolchain pins
        id: bpfpins
        run: |
          NIGHTLY="$(sed -n 's/^channel *= *"\(.*\)"/\1/p' crates/cfc-ebpf/rust-toolchain.toml)"
          LINKER="$(tr -d '[:space:]' < crates/cfc-ebpf/bpf-linker-version)"
          # An empty parse would silently install "latest" for both and produce
          # an object built by an unknown toolchain. Refuse instead.
          if [ -z "${NIGHTLY}" ] || [ -z "${LINKER}" ]; then
            echo "::error::could not read the eBPF toolchain pins (nightly='${NIGHTLY}' bpf-linker='${LINKER}')"
            exit 1
          fi
          echo "nightly=${NIGHTLY}" >> "${GITHUB_OUTPUT}"
          echo "linker=${LINKER}" >> "${GITHUB_OUTPUT}"
          echo "nightly=${NIGHTLY} bpf-linker=${LINKER}"

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: ${{ steps.bpfpins.outputs.nightly }}
          components: rust-src

      # Same trap ebpf.yml hit on 2026-08-23: `llvm-dev` is whatever the runner
      # image defaults to, and ubuntu's default is older than anything
      # bpf-linker 0.11 supports — it carries llvm-21, 22 and 23 and nothing
      # else. The major is derived from the pinned nightly rather than written
      # down, because the assert below requires the two to be equal and a
      # second hardcoded number could only drift away from the first.
      - name: Install bpf-linker
        run: |
          LLVM_MAJOR="$(rustc +${{ steps.bpfpins.outputs.nightly }} -vV | sed -n 's/^LLVM version: \([0-9]*\).*/\1/p')"
          if [ -z "${LLVM_MAJOR}" ]; then
            echo "::error::could not read rustc's LLVM version"; exit 1
          fi
          echo "pinned nightly uses LLVM ${LLVM_MAJOR}; building bpf-linker against it"

          sudo apt-get update
          sudo apt-get install -y lsb-release wget software-properties-common gnupg
          wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh "${LLVM_MAJOR}"
          sudo apt-get install -y "llvm-${LLVM_MAJOR}-dev" "libpolly-${LLVM_MAJOR}-dev"

          export "LLVM_SYS_${LLVM_MAJOR}1_PREFIX=/usr/lib/llvm-${LLVM_MAJOR}"
          export PATH="/usr/lib/llvm-${LLVM_MAJOR}/bin:${PATH}"
          cargo install bpf-linker --version "${{ steps.bpfpins.outputs.linker }}" --locked \
            --no-default-features --features "llvm-${LLVM_MAJOR}"

      # `bpfel-unknown-none` sets obj-is-bitcode, so rustc hands bpf-linker raw
      # LLVM bitcode and rustc's LLVM must not be NEWER than bpf-linker's, or
      # the link fails with `Invalid record`. Pinning the *rustc* that compiles
      # bpf-linker does not make this true by construction -- bpf-linker links
      # whatever libLLVM the system provides -- so assert it rather than assume.
      - name: Assert the LLVM versions pair
        run: |
          RUSTC_LLVM="$(rustc +${{ steps.bpfpins.outputs.nightly }} -vV | sed -n 's/^LLVM version: \([0-9]*\).*/\1/p')"
          LINKER_LLVM="$(bpf-linker --version 2>/dev/null | sed -n 's/.*LLVM \([0-9]*\).*/\1/p')"
          echo "rustc LLVM=${RUSTC_LLVM}  bpf-linker LLVM=${LINKER_LLVM}"
          if [ -z "${RUSTC_LLVM}" ]; then
            echo "::error::could not determine rustc's LLVM version"
            exit 1
          fi
          if [ -n "${LINKER_LLVM}" ] && [ "${RUSTC_LLVM}" -gt "${LINKER_LLVM}" ]; then
            echo "::error::rustc LLVM ${RUSTC_LLVM} is newer than bpf-linker's ${LINKER_LLVM}; the link will fail with 'Invalid record'. Bump crates/cfc-ebpf/bpf-linker-version or move the nightly pin back."
            exit 1
          fi

      - name: Build the BPF object
        run: |
          cargo xtask build-ebpf
          cargo xtask ebpf-check

      - name: Assemble tarball
        id: assemble
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          NAME="colony-firewall-control-${VERSION}-linux-x86_64"
          STAGE="$(mktemp -d)/${NAME}"
          mkdir -p "${STAGE}"

          install -m755 \
            target/release/colony-firewalld \
            target/release/colony-firewall \
            target/release/colony-firewall-tray \
            target/release/cfc \
            "${STAGE}/"

          # Executable, and not a binary: systemd execs it as the inbound
          # unit's ExecStartPre. colony.json re-applies 0755 on install, but
          # staging it 644 here would be a lie about what it is.
          install -m755 \
            scripts/inbound-lockout-guard.sh \
            "${STAGE}/"

          # Everything pkg/colony.json's postInstall installs. The tarball
          # layout is FLAT: postInstall runs with the extracted directory
          # as its working directory, so each file must be present under
          # its own basename. scripts/check-release-assets.sh gates this
          # list against the manifest on every push, so a file added to
          # postInstall but not staged here fails CI instead of silently
          # vanishing on the Colony channel.
          install -m644 \
            systemd/colony-firewalld.service \
            systemd/colony-firewall-nft.service \
            systemd/colony-firewall-nft-inbound.service \
            systemd/colony-firewall.sysusers \
            systemd/daemon.toml.sample \
            systemd/nftables-snippet.conf \
            systemd/nftables-inbound.conf \
            pkg/colony-firewall.desktop \
            pkg/colony-firewall-autostart.desktop \
            pkg/colony-firewall-tray-autostart.desktop \
            pkg/colony-firewall.svg \
            "${STAGE}/"

          # The kernel-side object. Fatal if absent: colony.json's postInstall
          # cannot express an optional file, so a tarball without it produces a
          # package whose install step fails outright.
          install -m644 \
            crates/cfc-ebpf/target/bpfel-unknown-none/release/cfc-ebpf.o \
            "${STAGE}/"

          # Docs, for parity with what the AUR package puts in
          # /usr/share/doc. `cfc status` points users at TROUBLESHOOTING.md
          # by name, so it has to actually ship.
          install -m644 \
            README.md \
            CHANGELOG.md \
            LICENSE \
            docs/ARCHITECTURE.md \
            docs/HARDENING.md \
            docs/TROUBLESHOOTING.md \
            "${STAGE}/"

          tar --zstd -C "$(dirname "${STAGE}")" -cf "${NAME}.tar.zst" "${NAME}"
          sha256sum "${NAME}.tar.zst" > SHA256SUMS

          echo "tarball=${NAME}.tar.zst" >> "${GITHUB_OUTPUT}"
          tar --zstd -tf "${NAME}.tar.zst"

      - name: Extract release notes from CHANGELOG.md
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          awk -v ver="${VERSION}" '
            $0 ~ ("^## \\[" ver "\\]") { in_section = 1; next }
            /^## \[/ { if (in_section) exit }
            in_section { print }
          ' CHANGELOG.md > RELEASE_BODY.md
          if [ ! -s RELEASE_BODY.md ]; then
            # On a tag this is fatal: falling back to the whole changelog
            # publishes the previous release's notes under the new version.
            if [ "${{ github.ref_type }}" = "tag" ]; then
              echo "::error::CHANGELOG.md has no '## [${VERSION}]' section - refusing to publish a release with the wrong notes. Rename the [Unreleased] section to [${VERSION}]."
              exit 1
            fi
            echo "::warning::No CHANGELOG section for ${VERSION}; using the full changelog."
            cp CHANGELOG.md RELEASE_BODY.md
          fi

      - name: Create draft release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          draft: true
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', steps.version.outputs.version) }}
          name: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', steps.version.outputs.version) }}
          body_path: RELEASE_BODY.md
          files: |
            ${{ steps.assemble.outputs.tarball }}
            SHA256SUMS

  # Build pkg/PKGBUILD for real against the freshly pushed tag, and produce
  # the AUR-submittable artifacts (PKGBUILD with real checksums + .SRCINFO).
  #
  # Hard gate, no continue-on-error: at tag time the source= URL
  # (.../archive/v$pkgver.tar.gz) resolves, because GitHub generates the
  # archive as soon as the tag exists. Skipped on workflow_dispatch, where
  # there is no tag for the source array to point at.
  pkgbuild:
    if: github.ref_type == 'tag'
    # Sequenced after `build` so the draft release already exists when the
    # AUR artifacts are attached to it, and so a broken build does not
    # spend half an hour compiling twice.
    needs: build
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Arch build deps
        run: |
          # Both makedepends and depends: without -s, makepkg aborts on any
          # missing dependency rather than installing it. pacman-contrib
          # provides updpkgsums.
          # This list MIRRORS pkg/PKGBUILD depends= + makedepends=, the same
          # way check.yml's pkgbuild-build mirrors PKGBUILD-git. 4fe0509 added
          # hicolor-icon-theme to THAT copy when makepkg refused the build; this
          # copy was missed, and the first tag run to get this far failed on
          # exactly the same missing dependency. Two hand-kept copies of one
          # list: when one learns something, the other must be taught too.
          pacman -Syu --noconfirm --needed \
            rust protobuf pkgconf git \
            nftables libxkbcommon wayland hicolor-icon-theme \
            namcap pacman-contrib

      - name: Prepare unprivileged build user
        run: |
          useradd -m builder
          chown -R builder: .

      - name: Verify pkgver matches the tag
        run: |
          PKGVER="$(sed -n 's/^pkgver=//p' pkg/PKGBUILD | head -n1)"
          if [ "${{ github.ref_name }}" != "v${PKGVER}" ]; then
            echo "::error::pkg/PKGBUILD pkgver=${PKGVER} does not match tag ${{ github.ref_name }}"
            exit 1
          fi

      - name: updpkgsums - replace the SKIP placeholder with real checksums
        working-directory: pkg
        run: |
          runuser -u builder -- updpkgsums PKGBUILD
          # A remote (non-VCS) source with sha256sums=('SKIP') is not
          # acceptable AUR practice: it disables integrity checking of the
          # release tarball entirely.
          if grep -qE "^sha256sums=\(.*'SKIP'" PKGBUILD; then
            echo "::error::pkg/PKGBUILD still has a SKIP checksum after updpkgsums"
            exit 1
          fi
          grep -A2 '^sha256sums=' PKGBUILD

      - name: Generate .SRCINFO
        working-directory: pkg
        run: runuser -u builder -- makepkg --printsrcinfo | tee .SRCINFO

      - name: namcap the PKGBUILD
        working-directory: pkg
        run: |
          namcap PKGBUILD | tee namcap.log
          # Warnings are advisory; errors are not.
          if grep -q ' E: ' namcap.log; then
            echo "::error::namcap reported errors in pkg/PKGBUILD"
            exit 1
          fi

      - name: Build the package (makepkg)
        working-directory: pkg
        run: |
          # --nocheck: check() re-runs the workspace test suite, which the
          # `test` job in check.yml already gates. Deps are preinstalled
          # above, so -s is not needed (and makepkg cannot sudo here).
          runuser -u builder -- makepkg --noconfirm --nocheck
          ls -l ./*.pkg.tar.*

      - name: namcap the built package
        working-directory: pkg
        run: |
          namcap ./*.pkg.tar.* | tee namcap-pkg.log
          if grep -q ' E: ' namcap-pkg.log; then
            echo "::error::namcap reported errors in the built package"
            exit 1
          fi

      - name: Attach AUR artifacts to the release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          draft: true
          tag_name: ${{ github.ref_name }}
          files: |
            pkg/PKGBUILD
            pkg/.SRCINFO
