# New outbound flows require a verdict from NFQUEUE 0. Fail-closed for
# everything except new loopback flows, which are allowed while no daemon
# listens on the queue. Established flows retain their connection-wide
# authorization, including SSH replies. While the daemon runs, new loopback
# flows follow explicit application policy; unmatched local IPC is allowed
# without prompting. See docs/HARDENING.md.
# Enable colony-firewall-nft.service for persistence. Its rules remain loaded
# across daemon restarts and stops. Lift filtering with
# `systemctl disable --now colony-firewall-nft`, not a plain stop.

# One nft -f transaction replaces an existing table without a filtering gap.
# add is idempotent and makes the same batch work on the first installation.
add table inet colony_firewall
delete table inet colony_firewall

table inet colony_firewall {
    # Retained empty for cleanup of older installations. Fast Allow is disabled;
    # no packet is accepted solely because it carries an application-set mark.
    set fast_allow {
        type mark
    }

    chain output {
        type filter hook output priority 0; policy drop;
        ct state established,related accept

        # The daemon's dedicated Reject sockets stamp this value. The root UID
        # check prevents CAP_NET_RAW users from forging this limited exception.
        # Only refusal packets qualify; ordinary root traffic still takes policy.
        meta skuid 0 meta mark 0xcfc00001 tcp flags & rst == rst accept
        meta skuid 0 meta mark 0xcfc00001 icmp type destination-unreachable accept
        meta skuid 0 meta mark 0xcfc00001 icmpv6 type destination-unreachable accept

        # Link control that never reaches the queue. Conntrack itself marks
        # IPv6 neighbour discovery and MLD untracked, so they cannot match
        # `ct state new` and would fall to the policy, taking IPv6 down with
        # them (no neighbour resolution, no multicast membership). IGMP is
        # tracked, but every report looks new and has no owning socket, so it
        # would be judged as an unknown program. Only the hop limits and
        # sources RFC 4861, RFC 3810 and RFC 3376 require are accepted, which
        # keeps these on the link. They mirror the inbound snippet.
        ip6 hoplimit 255 icmpv6 type { nd-router-solicit, nd-router-advert, nd-neighbor-solicit, nd-neighbor-advert } accept
        ip6 saddr { ::, fe80::/10 } ip6 hoplimit 1 icmpv6 type { mld-listener-query, mld-listener-report, mld-listener-done, mld2-listener-report } accept
        ip protocol igmp ip ttl 1 ip daddr 224.0.0.0/4 accept

        # Loopback is judged by the daemon while it runs. If the daemon is down,
        # bypass lets local IPC keep working, including the systemd-resolved
        # stub socket (cached names only: its upstream queries are not loopback);
        # every other new flow falls through to the fail-closed rule below.
        oifname "lo" ct state new queue num 0 bypass
        ct state new queue num 0
        # Other INVALID and UNTRACKED traffic drops, including explicit notrack
        # flows. An accept in another table cannot exempt them from this
        # policy; see docs/TROUBLESHOOTING.md.
    }
}
