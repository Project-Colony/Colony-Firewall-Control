# Inbound half of Colony Firewall Control.
#
# Deliberately a separate file and a separate unit from the outbound snippet.
# Outbound filtering is what CFC has always done and every install already has;
# inbound is opt-in, because switching it on can lock you out of a machine you
# reach over the network. Keeping them apart means enabling one is an explicit
# act and never a side effect of an upgrade.
#
#     systemctl enable --now colony-firewall-nft-inbound
#
# The daemon does not need to be told: it reads the netfilter hook off each
# packet (NF_INET_LOCAL_IN vs LOCAL_OUT), so one queue serves both chains and
# the direction is the kernel's answer rather than a guess from the addresses -
# which would be wrong on a multi-homed or routed host.
#
# WHAT GETS IN
#
# Nothing, unless a rule says so. An inbound flow that matches no rule takes
# `[default_policy] inbound_action`, which is Deny or Reject and cannot be set
# to Allow. There are no prompts on this path: a machine on a network is
# scanned continuously, the traffic is not caused by anything the user did, and
# a bubble per inbound SYN would be a denial of service on their attention -
# which is already in this project's threat model as a way it gets defeated.
#
# Authorise with rules:
#
#     cfc rules add --direction in --action allow --protocol tcp \
#         --dst-port 22 --src-net 192.168.1.0/24 --name ssh-from-lan
#
# Note the asymmetry, because it bites: inbound, `--dst-port` is the port on
# THIS host and `--src-net` is the peer. `--dst-net` is refused outright for an
# inbound rule - inbound, the destination is you.

table inet colony_firewall_inbound {
    chain input {
        type filter hook input priority 0; policy accept;

        # Loopback, first and unconditionally. The same reasoning as the
        # outbound chain: the systemd-resolved stub, every local IPC over TCP
        # and the daemon's own control socket live here, and filtering them
        # buys nothing while being an excellent way to wedge the machine.
        iifname "lo" accept

        # Traffic we asked for. Without this every reply to an outbound
        # connection would be judged as if it were someone calling us, which is
        # both wrong and catastrophic - the ACK of a connection the user
        # authorised a millisecond ago is not an inbound connection.
        ct state established,related accept

        # ICMP and ICMPv6 are how a network tells you things: path MTU
        # discovery, neighbour discovery, "no route to host". Dropping them
        # does not make a host safer, it makes it mysteriously slow - a black
        # hole for PMTU is one of the classic ways a firewall breaks large
        # transfers only, and only sometimes.
        meta l4proto { icmp, ipv6-icmp } accept

        # DHCPv6 and IPv6 router advertisements arrive unsolicited from
        # link-local addresses; without them a v6 network stops configuring
        # itself. Scoped to link-local so this is not a general hole.
        ip6 saddr fe80::/10 udp dport { 546, 547 } accept

        # Everything else that is a NEW connection goes to the daemon, which
        # answers from the rules. No `bypass`: if nothing is listening on the
        # queue, new inbound connections are dropped rather than admitted.
        # That is the fail-closed direction for an inbound chain, and unlike
        # the outbound one it costs availability of *services*, not of the
        # machine's own network access.
        ct state new queue num 0
    }
}
