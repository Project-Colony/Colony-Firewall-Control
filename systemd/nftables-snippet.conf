# Enqueue all new outbound connections to NFQUEUE 0 so colony-firewalld can
# decide. Drop on timeout = fail-closed; change to "queue num 0 bypass" if
# you want fail-open while the daemon is down.
#
# Install: nft -f nftables-snippet.conf  (or merge into /etc/nftables.conf)

table inet colony_firewall {
    chain output {
        type filter hook output priority 0; policy accept;
        ct state new queue num 0
    }
}
