# Enqueue all new outbound connections to NFQUEUE 0 so colony-firewalld can
# decide. Drop on timeout = fail-closed; change to "queue num 0 bypass" if
# you want fail-open while the daemon is down.
#
# Install: nft -f nftables-snippet.conf  (or merge into /etc/nftables.conf)
#
# Persistent enforcement: enable colony-firewall-nft.service instead of
# running nft by hand, so the ruleset survives a reboot and is removed
# again when the service stops. See docs/TROUBLESHOOTING.md before doing
# any of this on a machine you reach over SSH.

table inet colony_firewall {
    chain output {
        type filter hook output priority 0; policy accept;

        # Loopback is never filtered. Queuing it would intercept the
        # systemd-resolved stub resolver at 127.0.0.53 (and the daemon's
        # own resolver traffic), which stalls name resolution system-wide
        # for something a per-application firewall has no reason to police.
        oifname "lo" accept

        # Already-decided flows carry conntrack state; only the first
        # packet of a connection needs a verdict.
        ct state new queue num 0
    }
}
