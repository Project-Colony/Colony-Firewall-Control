# Enqueue all new outbound connections to NFQUEUE 0 so colony-firewalld can
# decide. Drop on timeout = fail-closed; change to "queue num 0 bypass" if
# you want fail-open while the daemon is down.
#
# Install: nft -f nftables-snippet.conf  (or merge into /etc/nftables.conf)
#
# Persistent enforcement: enable colony-firewall-nft.service instead of
# running nft by hand, so the ruleset survives a reboot and is removed
# again when the service stops. See docs/TROUBLESHOOTING.md before doing
# any of this on a machine you reach over SSH.

table inet colony_firewall {
    # Marks the output chain accepts without asking the queue.
    #
    # Declared empty on purpose. An empty set matches nothing, so a default
    # install carries no bypass token: this file is identical on every host
    # and world-readable, and nothing written in it can be a secret. The
    # daemon adds one element - a value drawn at random at each of its
    # starts - only when its fast-allow path is armed, and flushes the set
    # at every start and at shutdown. That is the only change the daemon
    # ever makes to this table.
    #
    # Why the value cannot simply be written here: since kernel 5.17 a
    # process needs only CAP_NET_RAW to set SO_MARK on its own sockets, and
    # docker grants that by default - so a container on --network=host,
    # which sits in this very output chain, could stamp a published value
    # on its sockets and walk past the queue. A per-start value drawn at
    # random is not in this file, so it has to be guessed: about 2^30 after
    # the daemon has excluded the marks well-known consumers select on, and
    # every wrong guess is a connection through a queue that prompts.
    #
    # Guessing is not the only way to learn it, and this comment used to
    # imply it was. A process the fast path has already granted can read
    # the value straight off its own socket with getsockopt(SO_MARK). That
    # is not a new privilege - that process is allowed by a rule, which is
    # why it was marked - but it does mean the value's secrecy is only ever
    # against processes that have never been granted, and it is why the
    # daemon flushes this set rather than leaving a value behind that
    # nothing refreshes.
    set fast_allow {
        type mark
    }

    chain output {
        type filter hook output priority 0; policy accept;

        # Loopback is never filtered. Queuing it would intercept the
        # systemd-resolved stub resolver at 127.0.0.53 (and the daemon's
        # own resolver traffic), which stalls name resolution system-wide
        # for something a per-application firewall has no reason to police.
        oifname "lo" accept

        # The fast path. The daemon's connect hook marks the sockets of a
        # process it has ruled allowed process-wide, and those flows are
        # accepted here without the NFQUEUE round trip. While the set is
        # empty this rule is inert; once armed, it stops matching new flows
        # within 60 s of the daemon going away, because the kernel side
        # re-decides the mark at every connect against a deadline that only
        # a live daemon refreshes.
        #
        # "At every connect", exactly: a socket already connected does not
        # pass that hook again, so it keeps the mark it was given. That is
        # why the kernel side refuses to mark a UDP socket at connect() -
        # it would be the one mark nothing could ever take back. UDP that
        # sends to a named destination is marked and re-decided on every
        # datagram instead. See docs/ARCHITECTURE.md.
        meta mark @fast_allow accept

        # Already-decided flows carry conntrack state; only the first
        # packet of a connection needs a verdict.
        ct state new queue num 0
    }
}
