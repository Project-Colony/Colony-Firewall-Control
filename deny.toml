# cargo-deny configuration for Colony Firewall Control.
# https://embarkstudios.github.io/cargo-deny/
#
# Checked in CI by .github/workflows/deny.yml (push, PR, and weekly cron).

[advisories]
# Any crate with a security vulnerability in the RustSec advisory DB fails
# the check (this is the default for advisories config v2 -- vulnerabilities
# are always errors).
version = 2
# Unmaintained crates are surfaced as warnings, not hard failures.
unmaintained = "workspace"
yanked = "deny"
ignore = [
    # quick-xml 0.37.x / 0.39.x DoS advisories (duplicate-attribute quadratic
    # scan, unbounded namespace allocation). Both versions reach us only as
    # BUILD-TIME dependencies: wayland-scanner parses the Wayland protocol XML
    # files vendored inside the wayland/winit crates, never untrusted input at
    # runtime. The fixed quick-xml (>= 0.41) is a semver-major bump that must
    # come from winit/iced upstream.
    # TODO: drop both ignores when iced/winit update wayland-scanner.
    "RUSTSEC-2026-0194",
    "RUSTSEC-2026-0195",
]

[licenses]
version = 2
# Allowlist compatible with this project's GPL-3.0-or-later license.
# Derived from `cargo deny list` over the current dependency tree.
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "GPL-3.0-or-later",
    "ISC",
    "LGPL-2.1-or-later",
    "MIT",
    "MPL-2.0",
    "NCSA",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.8

[bans]
# Duplicate versions of a crate in the graph are common in a GUI stack
# (iced pulls a deep tree); warn instead of failing.
multiple-versions = "warn"
wildcards = "allow"

[sources]
# Only crates.io is a permitted source; unknown registries and git
# dependencies fail the check.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
