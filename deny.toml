# cargo-deny configuration for Colony Firewall Control.
# https://embarkstudios.github.io/cargo-deny/
#
# Checked in CI by .github/workflows/deny.yml (push, PR, and weekly cron).

[advisories]
# Any crate with a security vulnerability in the RustSec advisory DB fails
# the check (this is the default for advisories config v2 -- vulnerabilities
# are always errors).
version = 2
# An unmaintained advisory fails the check when the crate is a direct
# dependency of a workspace crate.
unmaintained = "workspace"
yanked = "deny"
ignore = [
    # chrono is declared unmaintained and no maintained release exists to move
    # to. It is a direct dependency (timestamps in cfc-core, the daemon, the
    # CLI and the UI) and procfs also pulls it in. Replacing it with jiff or
    # time is a code migration of its own. Until then the advisory is ignored
    # so it does not fail every run; cargo-deny no longer reports it, so remove
    # this entry when chrono goes.
    { id = "RUSTSEC-2026-0543", reason = "chrono unmaintained, no fixed release; replacing it is a separate code migration" },
]

[licenses]
version = 2
# Allowlist compatible with this project's GPL-3.0-or-later license.
# Derived from `cargo deny list` over the current dependency tree.
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "GPL-3.0-or-later",
    "ISC",
    "LGPL-2.1-or-later",
    "MIT",
    "MPL-2.0",
    "NCSA",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.8

[bans]
# Duplicate versions of a crate in the graph are common in a GUI stack
# (iced pulls a deep tree); warn instead of failing.
multiple-versions = "warn"
wildcards = "allow"

[sources]
# Only crates.io is a permitted source; unknown registries and git
# dependencies fail the check.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
